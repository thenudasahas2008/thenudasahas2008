<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame (Monochrome Dark) -->
  <rect x="1.5" y="1.5" width="897" height="127" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

  <!-- Header Row -->
  <g transform="translate(24, 20)">
    <!-- Minimalist Globe Icon -->
    <circle cx="10" cy="10" r="9.5" fill="#161B22" stroke="#8B949E" stroke-width="1.4" />
    <ellipse cx="10" cy="10" rx="4" ry="9.5" stroke="#8B949E" stroke-width="1.2" fill="none" />
    <line x1="0.5" y1="10" x2="19.5" y2="10" stroke="#8B949E" stroke-width="1.2" />

    <!-- Title & Domain -->
    <text x="30" y="12" class="sans" font-size="16" font-weight="700" fill="#F0F6FC">Official Production Portfolio &amp; DFIR Platform</text>
    <text x="30" y="26" class="mono" font-size="9.5" font-weight="600" fill="#8B949E" letter-spacing="0.6">HTTPS://WWW.THENUDASAHAS.SITE</text>

    <!-- Status Pill (Monochrome) -->
    <rect x="520" y="0" width="138" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="532" cy="11" r="3" fill="#E6EDF3" />
    <text x="541" y="14.5" class="mono" font-size="8.5" font-weight="700" fill="#C9D1D9">LIVE IN PRODUCTION</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="58" x2="880" y2="58" stroke="#21262D" stroke-width="1" />

  <!-- Main Content Row -->
  <g transform="translate(24, 76)">
    <!-- Description -->
    <text class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      Comprehensive cybersecurity student portal showcasing academic qualifications, active engineering projects,
    </text>
    <text y="18" class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      DFIR research writeups, and verified defensive credentials built with high-performance responsive web standards.
    </text>

    <!-- Right Side Badges & CTA (Monochrome) -->
    <g transform="translate(580, -3)">
      <!-- Tech Badge 1 -->
      <rect width="78" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="39" y="16" class="mono" font-size="9.5" fill="#C9D1D9" font-weight="600" text-anchor="middle">Full Stack</text>

      <!-- Tech Badge 2 -->
      <rect x="86" width="94" height="24" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="133" y="16" class="mono" font-size="9.5" fill="#C9D1D9" font-weight="600" text-anchor="middle">DFIR Archive</text>

      <!-- Action Button -->
      <rect x="188" width="102" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
      <text x="239" y="16" class="mono" font-size="9.5" fill="#F0F6FC" font-weight="700" text-anchor="middle">VISIT SITE ↗</text>
    </g>
  </g>
</svg>
