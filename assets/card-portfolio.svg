<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071524" />
      <stop offset="50%" stop-color="#0B1E33" />
      <stop offset="100%" stop-color="#050E18" />
    </linearGradient>

    <linearGradient id="portBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="portTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#00BFA6" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="126" rx="12" fill="url(#portGrad)" stroke="url(#portBorder)" stroke-width="1.6" />
  
  <!-- Top Accent Laser -->
  <rect x="12" y="2" width="876" height="3" rx="1.5" fill="url(#portTop)" />

  <!-- Corner Tech Markings -->
  <path d="M 12 12 L 20 12 M 12 12 L 12 20" stroke="#00BFA6" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 888 12 L 880 12 M 888 12 L 888 20" stroke="#00BFA6" stroke-width="1.6" stroke-linecap="round" />

  <!-- Header Row -->
  <g transform="translate(24, 20)">
    <!-- Globe Icon -->
    <circle cx="10" cy="10" r="9.5" fill="#064E3B" stroke="#00BFA6" stroke-width="1.4" />
    <ellipse cx="10" cy="10" rx="4" ry="9.5" stroke="#00BFA6" stroke-width="1.2" fill="none" />
    <line x1="0.5" y1="10" x2="19.5" y2="10" stroke="#00BFA6" stroke-width="1.2" />

    <!-- Title & Domain -->
    <text x="30" y="12" class="sans" font-size="16" font-weight="800" fill="#FFFFFF">Official Production Portfolio &amp; DFIR Platform</text>
    <text x="30" y="26" class="mono" font-size="10" font-weight="700" fill="#00BFA6" letter-spacing="0.8">HTTPS://WWW.THENUDASAHAS.SITE</text>

    <!-- Status Pill -->
    <rect x="520" y="0" width="138" height="22" rx="11" fill="#042F2E" stroke="#10B981" stroke-width="1.2" />
    <circle cx="532" cy="11" r="3.5" fill="#34D399" />
    <text x="541" y="14.5" class="mono" font-size="9" font-weight="800" fill="#6EE7B7">LIVE IN PRODUCTION</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="58" x2="880" y2="58" stroke="#162E47" stroke-width="1.2" />

  <!-- Main Content Row -->
  <g transform="translate(24, 76)">
    <!-- Description -->
    <text class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      Comprehensive cybersecurity student portal showcasing academic qualifications, active engineering projects,
    </text>
    <text y="18" class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      DFIR research writeups, and verified defensive credentials built with high-performance responsive web standards.
    </text>

    <!-- Right Side Badges & CTA -->
    <g transform="translate(580, -3)">
      <!-- Tech Badge 1 -->
      <rect width="78" height="24" rx="5" fill="#082A3A" stroke="#22D3EE" stroke-width="1" />
      <text x="39" y="16" class="mono" font-size="9.5" fill="#22D3EE" font-weight="700" text-anchor="middle">Full Stack</text>

      <!-- Tech Badge 2 -->
      <rect x="86" width="94" height="24" rx="5" fill="#063229" stroke="#00BFA6" stroke-width="1" />
      <text x="133" y="16" class="mono" font-size="9.5" fill="#00BFA6" font-weight="700" text-anchor="middle">DFIR Archive</text>

      <!-- Action Button -->
      <rect x="188" width="102" height="24" rx="6" fill="#044334" stroke="#10B981" stroke-width="1.2" />
      <text x="239" y="16" class="mono" font-size="9.5" fill="#6EE7B7" font-weight="800" text-anchor="middle">VISIT SITE ↗</text>
    </g>
  </g>
</svg>
