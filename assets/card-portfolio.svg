<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="50%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#070C16" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#00BFA6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="938" height="128" rx="10" fill="url(#portBg)" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 10 1 L 930 1" stroke="url(#emeraldGlow)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Icon & Details -->
  <g transform="translate(24, 22)">
    <!-- Globe / Web Icon -->
    <circle cx="10" cy="10" r="9" fill="#064E3B" stroke="#00BFA6" stroke-width="1.3" />
    <ellipse cx="10" cy="10" rx="4" ry="9" stroke="#00BFA6" stroke-width="1.1" fill="none" />
    <line x1="1" y1="10" x2="19" y2="10" stroke="#00BFA6" stroke-width="1.1" />

    <!-- Title & URL -->
    <text x="28" y="12" class="sans" font-size="16" font-weight="700" fill="#FFFFFF">Official Production Portfolio</text>
    <text x="28" y="25" class="mono" font-size="10" font-weight="600" fill="#00BFA6">HTTPS://WWW.THENUDASAHAS.SITE</text>

    <!-- Status Badge -->
    <rect x="760" y="-3" width="130" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1" />
    <circle cx="771" cy="7" r="3" fill="#34D399" />
    <text x="780" y="10" class="mono" font-size="9" font-weight="700" fill="#6EE7B7">LIVE IN PRODUCTION</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="58" x2="920" y2="58" stroke="#1E293B" stroke-width="1" />

  <!-- Description -->
  <g transform="translate(24, 76)">
    <text x="0" y="8" class="sans" font-size="11.5" fill="#CBD5E1">
      Official cybersecurity student portal showcasing academic qualifications, DFIR research archives, active engineering
    </text>
    <text x="0" y="24" class="sans" font-size="11.5" fill="#CBD5E1">
      projects, and verifiable defense credentials built with modern high-performance web standards.
    </text>

    <!-- Right badges -->
    <g transform="translate(620, -2)">
      <rect width="78" height="22" rx="4" fill="#0F172A" stroke="#22D3EE" stroke-width="0.8" />
      <text x="39" y="15" class="mono" font-size="9" fill="#22D3EE" font-weight="600" text-anchor="middle">Full Stack</text>

      <rect x="86" width="94" height="22" rx="4" fill="#0F172A" stroke="#00BFA6" stroke-width="0.8" />
      <text x="133" y="15" class="mono" font-size="9" fill="#00BFA6" font-weight="600" text-anchor="middle">DFIR Archive</text>

      <rect x="188" width="96" height="22" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="0.8" />
      <text x="236" y="15" class="mono" font-size="9" fill="#10B981" font-weight="700" text-anchor="middle">VISIT SITE ➔</text>
    </g>
  </g>
</svg>
