<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="50%" stop-color="#0D1524" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1.5" y="1.5" width="877" height="212" rx="10" fill="url(#bgG)" stroke="#30363D" stroke-width="1.3" />
  <path d="M 10 1.5 L 870 1.5" stroke="url(#cyanLine)" stroke-width="2" stroke-linecap="round" />

  <!-- Terminal Header Bar -->
  <g transform="translate(20, 18)">
    <!-- Terminal Dots -->
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="20" cy="6" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="34" cy="6" r="4.5" fill="#10B981" opacity="0.85" />

    <!-- Terminal Title -->
    <text x="52" y="10" class="mono" font-size="11" font-weight="700" fill="#8B949E" letter-spacing="0.6">
      THENUDA SAHAS // SOFTWARE VELOCITY &amp; CYBERSECURITY TELEMETRY
    </text>

    <!-- Status Pill -->
    <rect x="704" y="-3" width="138" height="20" rx="10" fill="#042F2E" stroke="#10B981" stroke-width="1.2" />
    <circle cx="715" cy="7" r="3.5" fill="#34D399" />
    <text x="724" y="10.5" class="mono" font-size="8.5" font-weight="700" fill="#6EE7B7">TELEMETRY ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="1" y1="38" x2="879" y2="38" stroke="#21262D" stroke-width="1.2" />

  <!-- ==================== PANEL 1: PRODUCTION VELOCITY ==================== -->
  <g transform="translate(18, 50)">
    <rect width="268" height="126" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.2" />
    <!-- Header Badge -->
    <text x="14" y="20" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">01 // CODE VELOCITY</text>

    <!-- Big Metric -->
    <g transform="translate(14, 32)">
      <text x="0" y="22" class="sans" font-size="24" font-weight="800" fill="#F0F6FC">87+</text>
      <text x="54" y="14" class="sans" font-size="11" font-weight="700" fill="#58A6FF">Production Commits</text>
      <text x="54" y="26" class="sans" font-size="9.5" fill="#8B949E">Across Active Repositories</text>
    </g>

    <!-- Metric Rows -->
    <g transform="translate(14, 76)">
      <text x="0" y="0" class="sans" font-size="10.5" fill="#C9D1D9">• 100+ Total Contributions Recorded</text>
      <text x="0" y="16" class="sans" font-size="10.5" fill="#C9D1D9">• 7 Merged Pull Requests &amp; Reviews</text>
      <text x="0" y="32" class="mono" font-size="9" fill="#8B949E">Scope: AI Defense &amp; Automation Bots</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: LANGUAGE ARCHITECTURE ==================== -->
  <g transform="translate(302, 50)">
    <rect width="276" height="126" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.2" />
    <text x="14" y="20" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">02 // LANGUAGE DISTRIBUTION</text>

    <!-- Language Progress Bars -->
    <g transform="translate(14, 30)">
      <!-- JS Bar -->
      <rect width="248" height="7" rx="3.5" fill="#21262D" />
      <rect width="236" height="7" rx="3.5" fill="#F1E05A" />
      <rect x="236" width="9" height="7" fill="#3572A5" />
      <rect x="245" width="3" height="7" rx="1.5" fill="#89E051" />
    </g>

    <!-- Language Breakdown List -->
    <g transform="translate(14, 56)">
      <text x="0" y="0" class="sans" font-size="10.5" fill="#C9D1D9">
        <tspan fill="#F1E05A" font-weight="700">●</tspan> JavaScript (96.6%) <tspan fill="#8B949E">— Discord Audio Engine</tspan>
      </text>
      <text x="0" y="17" class="sans" font-size="10.5" fill="#C9D1D9">
        <tspan fill="#3572A5" font-weight="700">●</tspan> Python 3.11 (2.1%) <tspan fill="#8B949E">— AI Security &amp; DFIR</tspan>
      </text>
      <text x="0" y="34" class="sans" font-size="10.5" fill="#C9D1D9">
        <tspan fill="#89E051" font-weight="700">●</tspan> Bash &amp; Shell <tspan fill="#8B949E">— Linux Host Hardening</tspan>
      </text>
      <text x="0" y="50" class="mono" font-size="9" fill="#8B949E">Telemetry Source: GitHub Linguist Engine</text>
    </g>
  </g>

  <!-- ==================== PANEL 3: ACADEMIC & RESEARCH DOMAIN ==================== -->
  <g transform="translate(594, 50)">
    <rect width="268" height="126" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.2" />
    <text x="14" y="20" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">03 // DOMAIN &amp; RESEARCH</text>

    <g transform="translate(14, 38)">
      <text x="0" y="0" class="sans" font-size="11.5" font-weight="700" fill="#F0F6FC">🎓 Pearson BTEC HND</text>
      <text x="0" y="14" class="sans" font-size="9.5" fill="#8B949E">Computing &amp; Security Engineering</text>

      <text x="0" y="34" class="sans" font-size="10.5" fill="#C9D1D9">🛡️ PromptSentry — AI Defense Gateway</text>
      <text x="0" y="49" class="sans" font-size="10.5" fill="#C9D1D9">🔍 Digital Forensics &amp; Packet Triage</text>
      <text x="0" y="64" class="mono" font-size="9" font-weight="700" fill="#34D399">Defense Status: ACTIVE [100% SECURE]</text>
    </g>
  </g>

  <!-- Footer Terminal Command Bar -->
  <line x1="1" y1="188" x2="879" y2="188" stroke="#21262D" stroke-width="1.2" />
  <g transform="translate(20, 203)">
    <text x="0" y="0" class="mono" font-size="9.5" fill="#58A6FF" font-weight="700">$</text>
    <text x="12" y="0" class="mono" font-size="9.5" fill="#8B949E">git telemetry --user thenudasahas2008 --verify</text>
    <text x="460" y="0" class="mono" font-size="9" fill="#34D399" font-weight="600">[✓ 87 COMMITS • 100+ CONTRIBUTIONS SYNCHRONIZED]</text>
  </g>
</svg>
