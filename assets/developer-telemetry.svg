<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1.5" y="1.5" width="877" height="197" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <g transform="translate(20, 16)">
    <!-- Terminal Dots -->
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="20" cy="6" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="34" cy="6" r="4.5" fill="#10B981" opacity="0.8" />

    <!-- Terminal Title -->
    <text x="52" y="10" class="mono" font-size="11" font-weight="700" fill="#8B949E" letter-spacing="0.6">
      THENUDA SAHAS // DEVELOPER TELEMETRY &amp; VELOCITY DASHBOARD
    </text>

    <!-- Status Pill -->
    <rect x="710" y="-3" width="130" height="20" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="721" cy="7" r="3" fill="#58A6FF" />
    <text x="730" y="10.5" class="mono" font-size="8.5" font-weight="700" fill="#C9D1D9">TELEMETRY ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="1" y1="36" x2="879" y2="36" stroke="#21262D" stroke-width="1" />

  <!-- ==================== PANEL 1: CODE VOLUME & COMMITS ==================== -->
  <g transform="translate(18, 48)">
    <rect width="268" height="116" rx="7" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">01 // CODE ACTIVITY</text>

    <!-- Big Metric -->
    <text x="12" y="44" class="sans" font-size="22" font-weight="800" fill="#F0F6FC">87+</text>
    <text x="64" y="42" class="sans" font-size="11" font-weight="600" fill="#8B949E">Production Commits</text>

    <text x="12" y="66" class="sans" font-size="10.5" fill="#C9D1D9">• 100+ Total Contributions</text>
    <text x="12" y="84" class="sans" font-size="10.5" fill="#C9D1D9">• 7 Pull Requests &amp; Merges</text>
    <text x="12" y="102" class="mono" font-size="9.5" fill="#8B949E">Scope: Defense Tools &amp; Bots</text>
  </g>

  <!-- ==================== PANEL 2: LANGUAGE DISTRIBUTION ==================== -->
  <g transform="translate(302, 48)">
    <rect width="276" height="116" rx="7" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">02 // LANGUAGE DISTRIBUTION</text>

    <!-- Multi-Segment Language Bar -->
    <rect x="12" y="28" width="252" height="7" rx="3.5" fill="#21262D" />
    <rect x="12" y="28" width="236" height="7" rx="3.5" fill="#F1E05A" />
    <rect x="248" y="28" width="12" height="7" fill="#3572A5" />
    <rect x="260" y="28" width="4" height="7" rx="2" fill="#89E051" />

    <text x="12" y="54" class="sans" font-size="10.5" fill="#C9D1D9">
      <tspan fill="#F1E05A">●</tspan> JavaScript (96.6%) <tspan fill="#8B949E">— Bot Architecture</tspan>
    </text>
    <text x="12" y="72" class="sans" font-size="10.5" fill="#C9D1D9">
      <tspan fill="#3572A5">●</tspan> Python (2.1%) <tspan fill="#8B949E">— AI Security &amp; DFIR</tspan>
    </text>
    <text x="12" y="90" class="sans" font-size="10.5" fill="#C9D1D9">
      <tspan fill="#89E051">●</tspan> Shell / Bash <tspan fill="#8B949E">— Linux Hardening</tspan>
    </text>
    <text x="12" y="106" class="mono" font-size="9" fill="#8B949E">Verified via GitHub Linguist</text>
  </g>

  <!-- ==================== PANEL 3: RESEARCH & LAB FOCUS ==================== -->
  <g transform="translate(594, 48)">
    <rect width="268" height="116" rx="7" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#58A6FF">03 // DOMAIN &amp; RESEARCH</text>

    <text x="12" y="40" class="sans" font-size="11" font-weight="700" fill="#F0F6FC">🎓 Pearson BTEC HND</text>
    <text x="12" y="54" class="sans" font-size="9.5" fill="#8B949E">Computing &amp; Security Engineering</text>

    <text x="12" y="74" class="sans" font-size="10.5" fill="#C9D1D9">🛡️ PromptSentry Gateway</text>
    <text x="12" y="92" class="sans" font-size="10.5" fill="#C9D1D9">🔍 DFIR Packet &amp; Log Triage</text>
    <text x="12" y="106" class="mono" font-size="9" fill="#58A6FF">Defensive Posture: ACTIVE [OK]</text>
  </g>

  <!-- Footer Terminal Command Bar -->
  <line x1="1" y1="174" x2="879" y2="174" stroke="#21262D" stroke-width="1" />
  <g transform="translate(20, 189)">
    <text x="0" y="0" class="mono" font-size="9.5" fill="#58A6FF" font-weight="700">$</text>
    <text x="12" y="0" class="mono" font-size="9.5" fill="#8B949E">git telemetry --user thenudasahas2008</text>
    <text x="470" y="0" class="mono" font-size="9" fill="#34D399" font-weight="600">[✓ 87 COMMITS • 100+ CONTRIBUTIONS SYNCHRONIZED]</text>
  </g>
</svg>
