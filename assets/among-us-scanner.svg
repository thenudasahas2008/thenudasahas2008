<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081b29"/>
      <stop offset="100%" stop-color="#02121e"/>
    </linearGradient>
    <linearGradient id="crewmateCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatCrewmate {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-2deg); }
    }
    @keyframes floatPet {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }
    @keyframes pulseScan {
      0% { opacity: 0.2; transform: scaleX(0.98); }
      50% { opacity: 0.6; transform: scaleX(1); }
      100% { opacity: 0.2; transform: scaleX(0.98); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }
    @keyframes cyberBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .crewmate-group { animation: floatCrewmate 3.5s ease-in-out infinite; }
    .pet-group { animation: floatPet 2.8s ease-in-out infinite; }
    .star1 { animation: starTwinkle 2s infinite ease-in-out; }
    .star2 { animation: starTwinkle 3s infinite ease-in-out 0.7s; }
    .star3 { animation: starTwinkle 2.5s infinite ease-in-out 1.4s; }
    .radar-beam { animation: pulseScan 3s infinite ease-in-out; transform-origin: center; }
    .cursor-blink { animation: cyberBlink 1s infinite steps(2, start); }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#164e63" stroke-width="1.5"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.15" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40" stroke-dasharray="4,8"/>
    <line x1="0" y1="80" x2="850" y2="80" stroke-dasharray="4,8"/>
    <line x1="0" y1="120" x2="850" y2="120" stroke-dasharray="4,8"/>
    <line x1="150" y1="0" x2="150" y2="160" stroke-dasharray="4,8"/>
    <line x1="350" y1="0" x2="350" y2="160" stroke-dasharray="4,8"/>
    <line x1="550" y1="0" x2="550" y2="160" stroke-dasharray="4,8"/>
    <line x1="750" y1="0" x2="750" y2="160" stroke-dasharray="4,8"/>
  </g>

  <!-- Twinkling Space Stars -->
  <circle cx="80" cy="30" r="1.5" fill="#67e8f9" class="star1"/>
  <circle cx="220" cy="25" r="1" fill="#ffffff" class="star2"/>
  <circle cx="280" cy="130" r="2" fill="#38bdf8" class="star3"/>
  <circle cx="420" cy="20" r="1.5" fill="#67e8f9" class="star2"/>
  <circle cx="500" cy="140" r="1" fill="#ffffff" class="star1"/>
  <circle cx="640" cy="35" r="2" fill="#38bdf8" class="star3"/>
  <circle cx="790" cy="45" r="1.5" fill="#67e8f9" class="star1"/>
  <circle cx="720" cy="125" r="1" fill="#ffffff" class="star2"/>

  <!-- Scanner radar line -->
  <line x1="180" y1="15" x2="830" y2="15" stroke="#06b6d4" stroke-width="2" class="radar-beam" filter="url(#subtleGlow)"/>

  <!-- Crewmate Character (Cyan / Security Officer) -->
  <g class="crewmate-group" transform="translate(55, 30)">
    <!-- Backpack / Oxygen Tank -->
    <rect x="-14" y="25" width="14" height="46" rx="7" fill="#0e7490" stroke="#083344" stroke-width="3.5"/>

    <!-- Main Body -->
    <path d="M 10 12 C 10 0, 48 0, 48 12 L 48 70 C 48 76, 44 80, 38 80 L 34 80 C 28 80, 28 72, 28 66 L 28 66 C 28 72, 28 80, 22 80 L 18 80 C 12 80, 10 76, 10 70 Z" 
          fill="url(#crewmateCyan)" stroke="#083344" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Shadow under visor on body -->
    <path d="M 16 48 Q 28 54 44 48 L 44 58 Q 28 64 16 58 Z" fill="#0891b2" opacity="0.6"/>

    <!-- Visor -->
    <rect x="22" y="18" width="34" height="24" rx="12" fill="url(#visorGrad)" stroke="#083344" stroke-width="3.5" filter="url(#subtleGlow)"/>
    <!-- Visor Specular Reflection -->
    <ellipse cx="36" cy="24" rx="9" ry="4" fill="#ffffff" opacity="0.85" transform="rotate(-10 36 24)"/>

    <!-- Cybersecurity Detective/Officer Visor Cap -->
    <path d="M 14 10 Q 29 -3 44 10 L 49 11 Q 29 3 9 11 Z" fill="#0284c7" stroke="#083344" stroke-width="2.5"/>
    <rect x="18" y="-4" width="22" height="12" rx="4" fill="#0369a1" stroke="#083344" stroke-width="2.5"/>
    <!-- Golden Shield Badge on Cap -->
    <circle cx="29" cy="2" r="3" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Mini Crewmate (Pet) following -->
  <g class="pet-group" transform="translate(125, 80)">
    <!-- Mini Backpack -->
    <rect x="-7" y="12" width="7" height="22" rx="3.5" fill="#0e7490" stroke="#083344" stroke-width="2"/>
    <!-- Mini Body -->
    <path d="M 4 6 C 4 0, 24 0, 24 6 L 24 35 C 24 38, 22 40, 19 40 L 17 40 C 14 40, 14 36, 14 33 L 14 33 C 14 36, 14 40, 11 40 L 9 40 C 6 40, 4 38, 4 35 Z" 
          fill="url(#crewmateCyan)" stroke="#083344" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Mini Visor -->
    <rect x="10" y="9" width="17" height="12" rx="6" fill="url(#visorGrad)" stroke="#083344" stroke-width="2"/>
    <ellipse cx="17" cy="12" rx="4.5" ry="2" fill="#ffffff" opacity="0.9" transform="rotate(-10 17 12)"/>
  </g>

  <!-- Terminal / Scanner Content -->
  <g transform="translate(195, 38)">
    <!-- Header Tag -->
    <rect x="0" y="0" width="135" height="22" rx="4" fill="#0e7490" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1"/>
    <text x="67" y="15" fill="#22d3ee" font-family="'Fira Code', 'Courier New', monospace" font-size="10.5" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SEC_VERIFIED ඞ</text>

    <!-- Status Ping -->
    <circle cx="152" cy="11" r="4" fill="#10b981" class="cursor-blink"/>
    <text x="164" y="15" fill="#34d399" font-family="'Fira Code', 'Segoe UI', monospace" font-size="11" font-weight="bold">DEFENSIVE SYSTEMS ONLINE</text>

    <!-- Main Message -->
    <text x="0" y="47" fill="#f8fafc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.3">
      Thenuda Sahas was <tspan fill="#22d3ee">not An Impostor</tspan>. <tspan fill="#a5f3fc" font-weight="normal">0 Impostors remain.</tspan>
    </text>

    <!-- Cybersecurity Subtitle -->
    <text x="0" y="74" fill="#94a3b8" font-family="'Fira Code', 'Courier New', monospace" font-size="12">
      &gt; Role: <tspan fill="#67e8f9">Cybersecurity Student &amp; Builder</tspan> | Target: <tspan fill="#34d399">Zero Vulnerabilities</tspan> <tspan class="cursor-blink" fill="#22d3ee">_</tspan>
    </text>

    <!-- Mini Progress / Stats bar -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="450" height="7" rx="3.5" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>
      <rect x="0" y="0" width="385" height="7" rx="3.5" fill="url(#crewmateCyan)" filter="url(#subtleGlow)"/>
      <text x="465" y="8" fill="#64748b" font-family="'Fira Code', monospace" font-size="9.5">TASKS 100%</text>
    </g>
  </g>

  <!-- Right Side Cyber Badge / Seal -->
  <g transform="translate(740, 36)">
    <polygon points="45,0 85,22 85,68 45,90 5,68 5,22" fill="#082f49" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="45" y="42" fill="#22d3ee" font-family="sans-serif" font-size="26" text-anchor="middle">🛡️</text>
    <text x="45" y="66" fill="#67e8f9" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" text-anchor="middle">CYBER</text>
    <text x="45" y="77" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="7.5" text-anchor="middle">SECURITY</text>
  </g>
</svg>
