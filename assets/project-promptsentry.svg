<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame (100% Clickable Container) -->
  <rect x="1.5" y="1.5" width="437" height="192" rx="9" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Top Header Row -->
  <g transform="translate(20, 22)">
    <!-- GitHub Book Icon -->
    <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z" fill="#58A6FF" />

    <!-- Project Title (Larger Font) -->
    <text x="26" y="14" class="sans" font-size="18" font-weight="700" fill="#58A6FF">PromptSentry</text>

    <!-- Language Pill Right (Safely inside box) -->
    <rect x="282" y="-3" width="116" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="295" cy="8" r="3.5" fill="#3572A5" />
    <text x="306" y="11.5" class="mono" font-size="9.5" font-weight="700" fill="#C9D1D9">Python 3.11</text>
  </g>

  <!-- Subtitle (Larger Font) -->
  <text x="20" y="60" class="sans" font-size="13" font-weight="600" fill="#F0F6FC">AI Security Gateway &amp; Heuristic LLM Firewall</text>

  <!-- Clear Description (Larger, High-Contrast Font) -->
  <g transform="translate(20, 82)">
    <text class="sans" font-size="12.5" fill="#C9D1D9" font-weight="400">
      Heuristic defense gateway intercepting prompt injections,
    </text>
    <text y="18" class="sans" font-size="12.5" fill="#C9D1D9" font-weight="400">
      system jailbreaks, and OWASP LLM01 threats (&lt; 15ms).
    </text>
  </g>

  <!-- Tech Tags Row -->
  <g transform="translate(20, 126)">
    <rect width="84" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="42" y="15" class="mono" font-size="9.5" fill="#8B949E" font-weight="600" text-anchor="middle">Heuristics</text>

    <rect x="90" width="80" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="130" y="15" class="mono" font-size="9.5" fill="#8B949E" font-weight="600" text-anchor="middle">AI Safety</text>

    <rect x="176" width="88" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="220" y="15" class="mono" font-size="9.5" fill="#8B949E" font-weight="600" text-anchor="middle">Zero-Trust</text>
  </g>

  <!-- Divider & Action Footer -->
  <line x1="20" y1="158" x2="418" y2="158" stroke="#21262D" stroke-width="1" />
  <g transform="translate(20, 177)">
    <text x="0" y="0" class="mono" font-size="10" fill="#8B949E">thenudasahas2008 / PromptSentry</text>
    <!-- Perfectly Right-Aligned Inside Box Boundaries -->
    <text x="398" y="0" class="sans" font-size="12" font-weight="700" fill="#58A6FF" text-anchor="end">Inspect Codebase ➔</text>
  </g>
