<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Animation: Smooth Progress Shimmer */
      @keyframes shimmerMove {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(240px); }
      }
      .shimmer {
        animation: shimmerMove 2.8s ease-in-out infinite;
      }

      /* Animation: Status Pulse */
      @keyframes statusPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; filter: drop-shadow(0 0 5px #39D353); }
      }
      .pulse-dot {
        animation: statusPulse 2s ease-in-out infinite;
      }
    </style>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>

    <clipPath id="progressClipClean">
      <rect x="0" y="0" width="192" height="8" rx="4" />
    </clipPath>
  </defs>

  <!-- Outer Clean HUD Container -->
  <rect x="1.5" y="1.5" width="877" height="262" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Top Tactical Header Bar -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 38 L 1.5 38 Z" fill="#161B22" />
  <line x1="1.5" y1="38" x2="878.5" y2="38" stroke="#30363D" stroke-width="1" />

  <!-- Window Traffic Lights (Unified Clean Slate & Green) -->
  <circle cx="22" cy="20" r="4.5" fill="#30363D" />
  <circle cx="38" cy="20" r="4.5" fill="#30363D" />
  <circle cx="54" cy="20" r="4.5" fill="#22D3EE" />

  <!-- Header Title (Large & Readable) -->
  <text x="76" y="24" class="mono" font-size="12" font-weight="700" fill="#22D3EE">
    THENUDA SAHAS // STRATEGIC ACADEMIC &amp; CERTIFICATION ROADMAP
  </text>

  <!-- Live Status Badge Right -->
  <rect x="730" y="10" width="130" height="20" rx="10" fill="#0E4429" stroke="#238636" stroke-width="1" />
  <circle cx="742" cy="20" r="3.5" fill="#39D353" class="pulse-dot" />
  <text x="752" y="24" class="mono" font-size="9.5" font-weight="700" fill="#39D353">ROADMAP ACTIVE</text>

  <!-- ==================== COLUMN 1: HIGHER EDUCATION ==================== -->
  <g transform="translate(20, 50)">
    <rect width="268" height="168" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Pod Header -->
    <text x="18" y="24" class="mono" font-size="11" font-weight="700" fill="#22D3EE">01 // HIGHER EDUCATION</text>
    <line x1="18" y1="31" x2="250" y2="31" stroke="#21262D" stroke-width="1" />

    <!-- Degree Title (Bold, High Contrast White) -->
    <text x="18" y="52" class="sans" font-size="15.5" font-weight="700" fill="#FFFFFF">Pearson BTEC HND 🎓</text>
    <text x="18" y="69" class="sans" font-size="12" font-weight="500" fill="#8B949E">Computing (Cybersecurity)</text>

    <!-- Clear Bullet Points -->
    <g transform="translate(18, 86)" class="sans" font-size="12.5" fill="#F0F6FC">
      <text y="0">• Network Engineering &amp; Protocols</text>
      <text y="18">• Secure Database Architecture</text>
      <text y="36">• Software Engineering &amp; OOP</text>
    </g>

    <!-- Progress Bar (Clear & High Contrast) -->
    <g transform="translate(18, 142)">
      <rect width="232" height="8" rx="4" fill="#21262D" />
      <rect width="186" height="8" rx="4" fill="#22D3EE" />

      <!-- Animated Shimmer -->
      <g clip-path="url(#progressClipClean)">
        <rect x="0" y="0" width="80" height="8" fill="url(#shimmerGrad)" class="shimmer" />
      </g>

      <text x="232" y="-5" class="mono" font-size="10.5" fill="#22D3EE" font-weight="700" text-anchor="end">80% IN PROGRESS</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: APPLIED DFIR LABS ==================== -->
  <g transform="translate(306, 50)">
    <rect width="268" height="168" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Pod Header -->
    <text x="18" y="24" class="mono" font-size="11" font-weight="700" fill="#22D3EE">02 // APPLIED DFIR LABS</text>
    <line x1="18" y1="31" x2="250" y2="31" stroke="#21262D" stroke-width="1" />

    <!-- Labs Title (Bold White) -->
    <text x="18" y="52" class="sans" font-size="15.5" font-weight="700" fill="#FFFFFF">Defensive Security Labs 🛡️</text>
    <text x="18" y="69" class="sans" font-size="12" font-weight="500" fill="#8B949E">Incident Response &amp; Forensics</text>

    <!-- Highlights -->
    <g transform="translate(18, 86)" class="sans" font-size="12.5" fill="#F0F6FC">
      <text y="0">• Digital Evidence &amp; Custody</text>
      <text y="18">• Linux Hardening &amp; Automation</text>
      <text y="36">• Wireshark Deep Packet Inspection</text>
    </g>

    <!-- Status Tag Bottom -->
    <g transform="translate(18, 136)">
      <rect width="232" height="22" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="16" cy="11" r="3.5" fill="#22D3EE" />
      <text x="28" y="14.5" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">RESEARCH LABS OPERATIONAL</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: TARGET CREDENTIALS ==================== -->
  <g transform="translate(592, 50)">
    <rect width="268" height="168" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Pod Header -->
    <text x="18" y="24" class="mono" font-size="11" font-weight="700" fill="#22D3EE">03 // TARGET CREDENTIALS</text>
    <line x1="18" y1="31" x2="250" y2="31" stroke="#21262D" stroke-width="1" />

    <!-- Certifications List (High Contrast & Clean Tags) -->
    <g transform="translate(18, 52)" class="sans" font-size="13">
      <!-- CompTIA Security+ -->
      <g transform="translate(0, 0)">
        <text y="0" font-weight="700" fill="#FFFFFF">CompTIA Security+</text>
        <rect x="156" y="-12" width="76" height="18" rx="4" fill="#0D1117" stroke="#22D3EE" stroke-width="0.8" />
        <text x="194" y="0.5" class="mono" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="middle">[IN PREP]</text>
      </g>

      <!-- eJPT -->
      <g transform="translate(0, 27)">
        <text y="0" font-weight="700" fill="#FFFFFF">eJPT (Junior Pentester)</text>
        <rect x="156" y="-12" width="76" height="18" rx="4" fill="#0D1117" stroke="#22D3EE" stroke-width="0.8" />
        <text x="194" y="0.5" class="mono" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="middle">[ROADMAP]</text>
      </g>

      <!-- BTEC HND -->
      <g transform="translate(0, 54)">
        <text y="0" font-weight="700" fill="#FFFFFF">Pearson BTEC HND</text>
        <rect x="156" y="-12" width="76" height="18" rx="4" fill="#0D1117" stroke="#39D353" stroke-width="0.8" />
        <text x="194" y="0.5" class="mono" font-size="9" font-weight="700" fill="#39D353" text-anchor="middle">[CANDIDATE]</text>
      </g>
    </g>

    <!-- Schedule Badge Bottom -->
    <g transform="translate(18, 136)">
      <rect width="232" height="22" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="16" cy="11" r="3.5" fill="#39D353" class="pulse-dot" />
      <text x="28" y="14.5" class="mono" font-size="9.5" font-weight="700" fill="#39D353">SCHEDULE: 2026 - 2027</text>
    </g>
  </g>

  <!-- ==================== BOTTOM HUD COMMAND LINE ==================== -->
  <line x1="20" y1="230" x2="860" y2="230" stroke="#21262D" stroke-width="1" />

  <g transform="translate(24, 248)" class="mono">
    <text x="0" y="0" font-size="11" fill="#22D3EE" font-weight="700">
      $ roadmap --view academic-milestones --status verified
    </text>
    <text x="832" y="0" font-size="11" font-weight="700" fill="#39D353" text-anchor="end">
      [✔ 3 PILLARS ON TRACK • LIVE AUDIT PASSED]
    </text>
  </g>
</svg>
