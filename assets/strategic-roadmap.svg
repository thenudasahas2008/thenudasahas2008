<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .accent-glow { filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.25)); }
    </style>
  </defs>

  <!-- Outer Card Container -->
  <rect x="1.5" y="1.5" width="877" height="257" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Top Terminal Header -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 36 L 1.5 36 Z" fill="#161B22" />
  <line x1="1.5" y1="36" x2="878.5" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="19" r="4.5" fill="#27C93F" />

  <!-- Header Title -->
  <text x="72" y="23" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    THENUDA SAHAS // STRATEGIC ACADEMIC &amp; CERTIFICATION ROADMAP [2026 - 2027]
  </text>

  <!-- Status Badge Right -->
  <rect x="745" y="9" width="115" height="20" rx="10" fill="#0E4429" stroke="#238636" stroke-width="1" />
  <circle cx="756" cy="19" r="3" fill="#39D353" />
  <text x="765" y="23" class="mono" font-size="9" font-weight="700" fill="#39D353">ROADMAP ACTIVE</text>

  <!-- Grid Layout: 3 Columns -->

  <!-- ==================== COLUMN 1: ACADEMIC TRACK ==================== -->
  <rect x="20" y="48" width="268" height="162" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
  
  <text x="34" y="70" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">01 // HIGHER EDUCATION</text>
  <text x="34" y="90" class="sans" font-size="14.5" font-weight="700" fill="#F0F6FC">Pearson BTEC HND</text>
  <text x="34" y="106" class="sans" font-size="11" font-weight="500" fill="#8B949E">Computing (Cybersecurity &amp; Systems)</text>

  <g transform="translate(34, 122)">
    <text y="0" class="sans" font-size="11" fill="#C9D1D9">• Network Engineering &amp; Protocols</text>
    <text y="17" class="sans" font-size="11" fill="#C9D1D9">• Secure Database Architecture</text>
    <text y="34" class="sans" font-size="11" fill="#C9D1D9">• Software Engineering &amp; OOP</text>
  </g>

  <!-- Academic Progress Bar -->
  <g transform="translate(34, 185)">
    <rect width="240" height="7" rx="3.5" fill="#21262D" />
    <rect width="192" height="7" rx="3.5" fill="#22D3EE" />
    <text x="240" y="-4" class="mono" font-size="9" fill="#22D3EE" font-weight="700" text-anchor="end">80% IN PROGRESS</text>
  </g>

  <!-- ==================== COLUMN 2: LABS & RESEARCH ==================== -->
  <rect x="306" y="48" width="268" height="162" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

  <text x="320" y="70" class="mono" font-size="9.5" font-weight="700" fill="#A371F7">02 // APPLIED DFIR LABS</text>
  <text x="320" y="90" class="sans" font-size="14.5" font-weight="700" fill="#F0F6FC">Defensive Security Labs</text>
  <text x="320" y="106" class="sans" font-size="11" font-weight="500" fill="#8B949E">Incident Response &amp; Forensics Research</text>

  <g transform="translate(320, 122)">
    <text y="0" class="sans" font-size="11" fill="#C9D1D9">• Digital Evidence &amp; Chain-of-Custody</text>
    <text y="17" class="sans" font-size="11" fill="#C9D1D9">• Linux Hardening &amp; Bash Automation</text>
    <text y="34" class="sans" font-size="11" fill="#C9D1D9">• Wireshark Deep Packet Inspection</text>
  </g>

  <!-- Labs Status Badge -->
  <g transform="translate(320, 178)">
    <rect width="240" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <circle cx="12" cy="10" r="3" fill="#A371F7" />
    <text x="22" y="14" class="mono" font-size="9" fill="#D2A8FF" font-weight="600">PRACTICAL RESEARCH &amp; THREAT TRIAGE</text>
  </g>

  <!-- ==================== COLUMN 3: CERTIFICATIONS ==================== -->
  <rect x="592" y="48" width="268" height="162" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

  <text x="606" y="70" class="mono" font-size="9.5" font-weight="700" fill="#58A6FF">03 // TARGET CREDENTIALS</text>
  <text x="606" y="90" class="sans" font-size="14.5" font-weight="700" fill="#F0F6FC">Industry Certifications</text>
  <text x="606" y="106" class="sans" font-size="11" font-weight="500" fill="#8B949E">Targeted Cyber Credentials</text>

  <g transform="translate(606, 122)">
    <text y="0" class="sans" font-size="11" fill="#F0F6FC" font-weight="600">🎯 CompTIA Security+</text>
    <text x="240" y="0" class="mono" font-size="9" fill="#E3B341" font-weight="700" text-anchor="end">[In Prep]</text>

    <text y="18" class="sans" font-size="11" fill="#F0F6FC" font-weight="600">🛡️ eJPT (Junior Pentester)</text>
    <text x="240" y="18" class="mono" font-size="9" fill="#58A6FF" font-weight="700" text-anchor="end">[Roadmap]</text>

    <text y="36" class="sans" font-size="11" fill="#F0F6FC" font-weight="600">🎓 Pearson BTEC HND</text>
    <text x="240" y="36" class="mono" font-size="9" fill="#39D353" font-weight="700" text-anchor="end">[Candidate]</text>
  </g>

  <!-- Exam Target Badge -->
  <g transform="translate(606, 178)">
    <rect width="240" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1" />
    <circle cx="12" cy="10" r="3" fill="#58A6FF" />
    <text x="22" y="14" class="mono" font-size="9" fill="#58A6FF" font-weight="600">TARGET SCHEDULE: 2026 - 2027</text>
  </g>

  <!-- Footer Terminal Bar -->
  <line x1="20" y1="224" x2="860" y2="224" stroke="#21262D" stroke-width="1" />
  <g transform="translate(20, 243)">
    <text x="0" y="0" class="mono" font-size="10" fill="#8B949E">$ roadmap --view academic-milestones --status verified</text>
    <text x="840" y="0" class="mono" font-size="10" font-weight="700" fill="#39D353" text-anchor="end">[✔ 3 PILLARS ON TRACK]</text>
  </g>
</svg>