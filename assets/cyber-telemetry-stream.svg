<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 215" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="streamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D17" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#070C15" />
    </linearGradient>

    <!-- Cyan-Emerald Laser Top Accent -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00BFA6" stop-opacity="0" />
    </linearGradient>

    <!-- Spectrum Wave Gradient -->
    <linearGradient id="spectrumGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E4429" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Animation: Radar Sweep */
      @keyframes sweepRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .sweep-arm {
        transform-origin: 105px 65px;
        animation: sweepRotate 3.2s linear infinite;
      }

      /* Animation: Target Blips */
      @keyframes blipPulse {
        0%, 100% { opacity: 0.15; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      .blip1 { animation: blipPulse 1.8s ease-in-out infinite; transform-origin: 122px 52px; }
      .blip2 { animation: blipPulse 2.3s ease-in-out infinite 0.6s; transform-origin: 90px 75px; }
      .blip3 { animation: blipPulse 1.5s ease-in-out infinite 1.1s; transform-origin: 125px 78px; }

      /* Animation: Spectrum Wave Equalizer */
      @keyframes eqBounce {
        0%, 100% { transform: scaleY(0.2); }
        50% { transform: scaleY(1); }
      }
      .w1  { transform-origin: bottom; animation: eqBounce 1.2s ease-in-out infinite 0.1s; }
      .w2  { transform-origin: bottom; animation: eqBounce 1.5s ease-in-out infinite 0.3s; }
      .w3  { transform-origin: bottom; animation: eqBounce 1.1s ease-in-out infinite 0.5s; }
      .w4  { transform-origin: bottom; animation: eqBounce 1.6s ease-in-out infinite 0.2s; }
      .w5  { transform-origin: bottom; animation: eqBounce 1.3s ease-in-out infinite 0.4s; }
      .w6  { transform-origin: bottom; animation: eqBounce 1.7s ease-in-out infinite 0.6s; }
      .w7  { transform-origin: bottom; animation: eqBounce 1.2s ease-in-out infinite 0.1s; }
      .w8  { transform-origin: bottom; animation: eqBounce 1.5s ease-in-out infinite 0.3s; }
      .w9  { transform-origin: bottom; animation: eqBounce 1.3s ease-in-out infinite 0.5s; }
      .w10 { transform-origin: bottom; animation: eqBounce 1.6s ease-in-out infinite 0.2s; }
      .w11 { transform-origin: bottom; animation: eqBounce 1.2s ease-in-out infinite 0.4s; }
      .w12 { transform-origin: bottom; animation: eqBounce 1.4s ease-in-out infinite 0.6s; }

      /* Animation: Live Beacon */
      @keyframes beaconRing {
        0% { r: 3; opacity: 1; }
        100% { r: 8; opacity: 0; }
      }
      .beacon-ring { animation: beaconRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }

      /* Animation: Blinking Cursor */
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: cursorBlink 0.9s infinite; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1.5" y="1.5" width="877" height="212" rx="10" fill="url(#streamBg)" stroke="#30363D" stroke-width="1.3" />

  <!-- Glowing Laser Top Accent -->
  <rect x="10" y="1.5" width="860" height="2" rx="1" fill="url(#laserCyan)" />

  <!-- Terminal Header Bar -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 34 L 1.5 34 Z" fill="#161B22" />
  <line x1="1.5" y1="34" x2="878.5" y2="34" stroke="#30363D" stroke-width="1" />

  <!-- Terminal Controls -->
  <circle cx="20" cy="18" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="18" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="18" r="4.5" fill="#27C93F" />

  <!-- Terminal Title -->
  <text x="74" y="22" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    THENUDA SAHAS // REAL-TIME NETWORK PACKET &amp; DEFENSE TELEMETRY
  </text>

  <!-- Live Stream Active Badge Right -->
  <g transform="translate(735, 7)">
    <rect width="125" height="20" rx="10" fill="#0E4429" stroke="#238636" stroke-width="1" />
    <circle cx="14" cy="10" r="7" stroke="#22D3EE" stroke-width="1" fill="none" class="beacon-ring" />
    <circle cx="14" cy="10" r="3" fill="#39D353" />
    <text x="26" y="13.5" class="mono" font-size="9" font-weight="700" fill="#39D353">STREAM ACTIVE</text>
  </g>

  <!-- ==================== PANEL 1: THREAT RADAR SCANNER ==================== -->
  <g transform="translate(18, 44)">
    <rect width="215" height="134" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="12" y="17" class="mono" font-size="9" font-weight="700" fill="#22D3EE">01 // THREAT RADAR</text>

    <!-- Radar Center (105, 65) -->
    <g transform="translate(0, 0)">
      <circle cx="105" cy="65" r="36" stroke="#21262D" stroke-width="1.2" fill="#0D1117" />
      <circle cx="105" cy="65" r="24" stroke="#21262D" stroke-width="0.8" fill="none" />
      <circle cx="105" cy="65" r="12" stroke="#21262D" stroke-width="0.8" fill="none" />

      <!-- Crosshairs -->
      <line x1="69" y1="65" x2="141" y2="65" stroke="#21262D" stroke-width="0.8" />
      <line x1="105" y1="29" x2="105" y2="101" stroke="#21262D" stroke-width="0.8" />

      <!-- Rotating Sweep Arm -->
      <g class="sweep-arm">
        <line x1="105" y1="65" x2="141" y2="65" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
        <path d="M 105 65 L 141 65 A 36 36 0 0 0 137 44 Z" fill="url(#radarSweep)" />
      </g>

      <!-- Pulsing Target Blips -->
      <circle cx="122" cy="52" r="2.8" fill="#39D353" class="blip1" />
      <circle cx="90" cy="75" r="2.2" fill="#22D3EE" class="blip2" />
      <circle cx="125" cy="78" r="2.2" fill="#38BDF8" class="blip3" />
    </g>

    <text x="107" y="122" class="mono" font-size="8.5" fill="#39D353" font-weight="700" text-anchor="middle">
      [✔ PERIMETER SECURE]
    </text>
  </g>

  <!-- ==================== PANEL 2: SPECTRUM ACTIVITY WAVE ==================== -->
  <g transform="translate(247, 44)">
    <rect width="280" height="134" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="14" y="17" class="mono" font-size="9" font-weight="700" fill="#22D3EE">02 // ACTIVITY &amp; TRAFFIC SPECTRUM</text>

    <!-- Animated Equalizer Spectrum Bars -->
    <g transform="translate(20, 30)">
      <!-- 12 Wave Bars -->
      <rect x="0"   y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w1"  />
      <rect x="18"  y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w2"  />
      <rect x="36"  y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w3"  />
      <rect x="54"  y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w4"  />
      <rect x="72"  y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w5"  />
      <rect x="90"  y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w6"  />
      <rect x="108" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w7"  />
      <rect x="126" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w8"  />
      <rect x="144" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w9"  />
      <rect x="162" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w10" />
      <rect x="180" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w11" />
      <rect x="198" y="0" width="10" height="52" rx="2" fill="url(#spectrumGrad)" class="w12" />
    </g>

    <!-- Sub Info Line -->
    <g transform="translate(14, 102)" class="mono" font-size="9">
      <text y="0" fill="#C9D1D9">PromptSentry Latency : <tspan fill="#39D353" font-weight="700">&lt; 15ms</tspan></text>
      <text y="16" fill="#8B949E">Packet Filter Posture: <tspan fill="#22D3EE" font-weight="700">ZERO-TRUST [OK]</tspan></text>
    </g>
  </g>

  <!-- ==================== PANEL 3: LIVE TELEMETRY LOG ==================== -->
  <g transform="translate(541, 44)">
    <rect width="321" height="134" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="14" y="17" class="mono" font-size="9" font-weight="700" fill="#22D3EE">03 // LIVE SECURITY LOGS</text>

    <!-- Terminal Log Stream -->
    <g transform="translate(14, 34)" class="mono" font-size="9.5">
      <text y="0" fill="#8B949E">[<tspan fill="#22D3EE">TRIAGE</tspan>] Wireshark deep inspection... <tspan fill="#39D353">✔</tspan></text>
      <text y="17" fill="#8B949E">[<tspan fill="#22D3EE">GATEWAY</tspan>] PromptSentry heuristic rules: <tspan fill="#39D353">PASS</tspan></text>
      <text y="34" fill="#8B949E">[<tspan fill="#22D3EE">SHA-256</tspan>] Forensics evidence hash: <tspan fill="#58A6FF">MATCH</tspan></text>
      <text y="51" fill="#8B949E">[<tspan fill="#22D3EE">STATUS</tspan>] Zero critical breach indicators</text>
      
      <!-- Live Command Prompt & Blinking Cursor -->
      <text y="72" fill="#39D353" font-weight="700">
        $ live-audit --daemon <tspan class="cursor" fill="#22D3EE">█</tspan>
      </text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <line x1="20" y1="188" x2="860" y2="188" stroke="#21262D" stroke-width="1" />
  <g transform="translate(20, 203)" class="mono" font-size="9.5">
    <text x="0" y="0" fill="#8B949E">$ telemetry --stream network-security --format live</text>
    <text x="840" y="0" fill="#39D353" font-weight="700" text-anchor="end">[ALL SENSORS NORMAL 🇱🇰]</text>
  </g>
</svg>