<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .glow-red { filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.4)); }
      .glow-cyan { filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.4)); }
      .glow-green { filter: drop-shadow(0 0 6px rgba(57, 211, 83, 0.4)); }

      /* ========================================================
         RAW TERMINAL TYPEWRITER and LOG STREAM ANIMATION (14s Loop)
         ======================================================== */

      /* 1. Neofetch Command Letter-by-Letter Typing (steps(28)) */
      @keyframes typeCommand1 {
        0%, 3%    { transform: translateX(0px); }
        18%, 92%  { transform: translateX(290px); }
        97%, 100% { transform: translateX(0px); }
      }

      .type-cover-cmd {
        animation: typeCommand1 14s steps(28, end) infinite;
      }

      /* 2. Blinking Block Cursor (█) */
      @keyframes blinkBlockCursor {
        0%, 48%  { opacity: 1; }
        50%, 98% { opacity: 0; }
        100%     { opacity: 1; }
      }

      .cursor-blink {
        animation: blinkBlockCursor 0.5s infinite;
      }

      /* 3. BlackArch Neofetch Output Stream Reveal */
      @keyframes streamOutput {
        0%, 18%  { opacity: 0; }
        21%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }

      .terminal-stream {
        animation: streamOutput 14s ease-out infinite;
      }

      /* 4. Cascading Telemetry Rows (Opacity Only - Rock-Solid Coordinates) */
      @keyframes cascade0 { 0%, 21% { opacity: 0; } 23%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade1 { 0%, 23% { opacity: 0; } 25%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade2 { 0%, 25% { opacity: 0; } 27%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade3 { 0%, 27% { opacity: 0; } 29%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade4 { 0%, 29% { opacity: 0; } 31%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade5 { 0%, 31% { opacity: 0; } 33%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade6 { 0%, 33% { opacity: 0; } 35%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes cascade7 { 0%, 35% { opacity: 0; } 37%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }

      .stream-row-0 { animation: cascade0 14s ease-out infinite; }
      .stream-row-1 { animation: cascade1 14s ease-out infinite; }
      .stream-row-2 { animation: cascade2 14s ease-out infinite; }
      .stream-row-3 { animation: cascade3 14s ease-out infinite; }
      .stream-row-4 { animation: cascade4 14s ease-out infinite; }
      .stream-row-5 { animation: cascade5 14s ease-out infinite; }
      .stream-row-6 { animation: cascade6 14s ease-out infinite; }
      .stream-row-7 { animation: cascade7 14s ease-out infinite; }

      /* 5. Footer Sysctl Command Letter-by-Letter (steps(45)) */
      @keyframes typeFooterCmd {
        0%, 54%   { transform: translateX(0px); }
        72%, 93%  { transform: translateX(370px); }
        97%, 100% { transform: translateX(0px); }
      }

      .type-cover-footer {
        animation: typeFooterCmd 14s steps(45, end) infinite;
      }

      /* 6. Footer Badge Reveal */
      @keyframes revealFooterBadge {
        0%, 72%  { opacity: 0; }
        75%, 93% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }

      .footer-badge {
        animation: revealFooterBadge 14s ease-out infinite;
      }

      /* 7. Status LED Pulse */
      @keyframes statusLedPulse {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1.0; }
      }

      .status-led {
        animation: statusLedPulse 1.8s ease-in-out infinite;
      }
    </style>

    <!-- BlackArch Blood-Red to Crimson Gradient -->
    <linearGradient id="blackArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <pattern id="terminalPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Terminal Window Outer Container (No inner cards!) -->
  <rect x="1.5" y="1.5" width="877" height="342" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />
  <rect x="1.5" y="36" width="877" height="307" fill="url(#terminalPattern)" />

  <!-- Terminal Top Header Bar -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 36 L 1.5 36 Z" fill="#161B22" />
  <line x1="1.5" y1="36" x2="878.5" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Window Traffic Lights -->
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="19" r="4.5" fill="#27C93F" />

  <!-- Terminal Tab Title -->
  <text x="74" y="23" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    root@blackarch-dfir: ~ (bash) &#8212; 80x24
  </text>

  <!-- Live Status Badge Right -->
  <rect x="670" y="9" width="190" height="20" rx="10" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
  <circle cx="683" cy="19" r="3.5" fill="#ef4444" class="glow-red status-led" />
  <text x="694" y="23" class="mono" font-size="9" font-weight="700" fill="#fca5a5">ROOT PRIVILEGES [ACTIVE]</text>

  <!-- ==================== RAW TERMINAL CONTENT (NO BOXES) ==================== -->
  
  <!-- Command 1: Root Prompt and Neofetch Command Typing -->
  <g transform="translate(24, 60)" class="mono" font-size="11">
    <!-- Prompt: [root@blackarch-dfir ~]# -->
    <text x="0" y="0">
      <tspan fill="#ef4444" font-weight="700">[root@blackarch-dfir</tspan>
      <tspan fill="#58a6ff" font-weight="700"> ~</tspan>
      <tspan fill="#ef4444" font-weight="700">]#</tspan>
    </text>

    <!-- Typing Command Text -->
    <g transform="translate(195, 0)">
      <text x="0" y="0" fill="#f0f6fc" font-weight="700">neofetch --security-profile</text>
      <!-- Stepping Cover that uncovers command letter-by-letter -->
      <g class="type-cover-cmd">
        <rect x="0" y="-12" width="310" height="16" fill="#0D1117" />
        <rect x="0" y="-11" width="8" height="14" rx="1" fill="#ef4444" class="cursor-blink" />
      </g>
    </g>
  </g>

  <!-- Terminal Output Stream (Neofetch BlackArch ASCII + System Specs) -->
  <g class="terminal-stream">

    <!-- ==================== LEFT: BLACKARCH LINUX ASCII LOGO ==================== -->
    <g transform="translate(28, 85)" class="mono" font-size="11" font-weight="700">
      <!-- High-Tech BlackArch Vector Crest -->
      <g filter="url(#glow-red)" class="glow-red">
        <!-- Iconic BlackArch Triangle Glyph -->
        <polygon points="80,10 145,140 120,140 80,48 40,140 15,140" fill="url(#blackArchGrad)"/>
        <!-- Inner Crossbar & Blade Cutout -->
        <polygon points="80,68 106,128 54,128" fill="#0D1117"/>
        <path d="M 80 82 L 95 120 L 65 120 Z" fill="url(#blackArchGrad)"/>
        <!-- Central Glow Eye -->
        <circle cx="80" cy="102" r="3" fill="#ffffff"/>
      </g>
      <!-- Sub-label -->
      <text x="80" y="168" text-anchor="middle" font-size="11" font-weight="800" fill="#ef4444" letter-spacing="1">BLACKARCH</text>
      <text x="80" y="184" text-anchor="middle" font-size="8.5" font-weight="700" fill="#8b949e">PENETRATION &amp; DFIR OS</text>
    </g>

    <!-- Divider Line between ASCII and Data -->
    <line x1="205" y1="82" x2="205" y2="280" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- ==================== RIGHT: RAW TERMINAL SYSTEM & ARSENAL SPECS ==================== -->
    <!-- Direct Y coordinates: 100% Rock-Solid Grid, No Overlapping Transforms! -->
    <g transform="translate(225, 102)" class="mono" font-size="11">
      
      <!-- Row 0: OS -->
      <g class="stream-row-0">
        <text x="0" y="0" font-weight="700" fill="#ef4444">OS</text>
        <text x="85" y="0" fill="#8b949e">:</text>
        <text x="100" y="0" fill="#f0f6fc" font-weight="700">BlackArch Linux x86_64</text>
        <text x="310" y="0" fill="#8b949e">(rolling release)</text>
      </g>

      <!-- Row 1: Host and Kernel -->
      <g class="stream-row-1">
        <text x="0" y="21" font-weight="700" fill="#ef4444">KERNEL</text>
        <text x="85" y="21" fill="#8b949e">:</text>
        <text x="100" y="21" fill="#79c0ff" font-weight="600">6.11.8-hardened-blackarch</text>
        <text x="310" y="21" fill="#8b949e">#1 SMP PREEMPT_DYNAMIC</text>
      </g>

      <!-- Row 2: Arsenal Packages -->
      <g class="stream-row-2">
        <text x="0" y="42" font-weight="700" fill="#ef4444">PACKAGES</text>
        <text x="85" y="42" fill="#8b949e">:</text>
        <text x="100" y="42" fill="#f0f6fc">2,928 (blackarch), 1,240 (pacman)</text>
      </g>

      <!-- Row 3: Shell & Defense Lab -->
      <g class="stream-row-3">
        <text x="0" y="63" font-weight="700" fill="#ef4444">LAB HOST</text>
        <text x="85" y="63" fill="#8b949e">:</text>
        <text x="100" y="63" fill="#22d3ee" font-weight="600">DFIR Threat Defense Node</text>
        <text x="310" y="63" fill="#8b949e">[uptime: 24/7]</text>
      </g>

      <!-- Row 4: Identity and Credentials -->
      <g class="stream-row-4">
        <text x="0" y="84" font-weight="700" fill="#a371f7">OPERATOR</text>
        <text x="85" y="84" fill="#8b949e">:</text>
        <text x="100" y="84" fill="#ffffff" font-weight="700">Thenuda Sahas</text>
        <text x="220" y="84" fill="#58a6ff">(BTEC HND Computing)</text>
      </g>

      <!-- Row 5: Focus Domain -->
      <g class="stream-row-5">
        <text x="0" y="105" font-weight="700" fill="#a371f7">FOCUS</text>
        <text x="85" y="105" fill="#8b949e">:</text>
        <text x="100" y="105" fill="#38bdf8" font-weight="600">Digital Forensics &amp; Threat Triage (DFIR)</text>
      </g>

      <!-- Row 6: Security Stack -->
      <g class="stream-row-6">
        <text x="0" y="126" font-weight="700" fill="#a371f7">ARSENAL</text>
        <text x="85" y="126" fill="#8b949e">:</text>
        <text x="100" y="126" fill="#f0f6fc">Wireshark &#8226; Volatility &#8226; Python &#8226; Ghidra &#8226; Bash &#8226; Nmap</text>
      </g>

      <!-- Row 7: Live Status -->
      <g class="stream-row-7">
        <text x="0" y="147" font-weight="700" fill="#39d353">STATUS</text>
        <text x="85" y="147" fill="#8b949e">:</text>
        <text x="100" y="147" fill="#39d353" font-weight="700">All Perimeters Enforced [0 Compromises] &#10004;</text>
      </g>

      <!-- Terminal Color Palette Blocks -->
      <g transform="translate(100, 164)">
        <rect x="0" y="0" width="18" height="8" rx="1.5" fill="#0d1117"/>
        <rect x="22" y="0" width="18" height="8" rx="1.5" fill="#ef4444"/>
        <rect x="44" y="0" width="18" height="8" rx="1.5" fill="#22c55e"/>
        <rect x="66" y="0" width="18" height="8" rx="1.5" fill="#eab308"/>
        <rect x="88" y="0" width="18" height="8" rx="1.5" fill="#3b82f6"/>
        <rect x="110" y="0" width="18" height="8" rx="1.5" fill="#a855f7"/>
        <rect x="132" y="0" width="18" height="8" rx="1.5" fill="#06b6d4"/>
        <rect x="154" y="0" width="18" height="8" rx="1.5" fill="#f0f6fc"/>
      </g>
    </g>

  </g>

  <!-- ==================== BOTTOM COMMAND and TELEMETRY FOOTER ==================== -->
  <line x1="24" y1="302" x2="856" y2="302" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3" />

  <g transform="translate(24, 323)" class="mono" font-size="11">
    <!-- Prompt: [root@blackarch ~]# sysctl  - security.perimeter=enforce -->
    <text x="0" y="0">
      <tspan fill="#ef4444" font-weight="700">[root@blackarch-dfir</tspan>
      <tspan fill="#58a6ff" font-weight="700"> ~</tspan>
      <tspan fill="#ef4444" font-weight="700">]#</tspan>
    </text>

    <!-- Footer Command Typing -->
    <g transform="translate(195, 0)">
      <text x="0" y="0" fill="#39d353" font-weight="700">sysctl -p /etc/sysctl.d/99-hardened.conf</text>
      <g class="type-cover-footer">
        <rect x="0" y="-12" width="380" height="16" fill="#0D1117" />
        <rect x="0" y="-11" width="8" height="14" rx="1" fill="#39d353" class="cursor-blink" />
      </g>
    </g>

    <!-- Sleek Verification Badge Right -->
    <g class="footer-badge">
      <text x="832" y="0" font-size="10" font-weight="700" fill="#39d353" text-anchor="end">
        [&#10004; ZERO-TRUST ENFORCED &#8226; LK DEFENSE ACTIVE]
      </text>
    </g>
  </g>
</svg>
