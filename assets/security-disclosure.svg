<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Outer Card Container -->
  <rect x="1.5" y="1.5" width="877" height="167" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Top Terminal Header -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 36 L 1.5 36 Z" fill="#161B22" />
  <line x1="1.5" y1="36" x2="878.5" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="19" r="4.5" fill="#27C93F" />

  <!-- Header Title -->
  <text x="72" y="23" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    THENUDA SAHAS // COORDINATED VULNERABILITY DISCLOSURE &amp; SECURITY POLICY
  </text>

  <!-- Status Badge Right -->
  <rect x="735" y="9" width="125" height="20" rx="10" fill="#123C35" stroke="#238636" stroke-width="1" />
  <circle cx="746" cy="19" r="3" fill="#39D353" />
  <text x="755" y="23" class="mono" font-size="9" font-weight="700" fill="#39D353">SAFE HARBOR ACTIVE</text>

  <!-- Grid Layout: 3 Columns -->

  <!-- ==================== CELL 1: TARGET SCOPE ==================== -->
  <rect x="20" y="48" width="268" height="82" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="34" y="66" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">01 // AUTHORIZED SCOPE</text>
  <text x="34" y="86" class="mono" font-size="12" font-weight="700" fill="#F0F6FC">*.thenudasahas.site</text>
  <text x="34" y="103" class="sans" font-size="10.5" fill="#8B949E">Repositories @thenudasahas2008</text>
  <text x="34" y="120" class="mono" font-size="9" font-weight="600" fill="#39D353">[IN-SCOPE FOR TESTING]</text>

  <!-- ==================== CELL 2: CONTACT & SLA ==================== -->
  <rect x="306" y="48" width="268" height="82" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="320" y="66" class="mono" font-size="9.5" font-weight="700" fill="#58A6FF">02 // REPORTING CHANNEL</text>
  <text x="320" y="86" class="mono" font-size="12" font-weight="700" fill="#F0F6FC">sahas.thenu@gmail.com</text>
  <text x="320" y="103" class="sans" font-size="10.5" fill="#8B949E">PGP / GPG Supported Communication</text>
  <text x="320" y="120" class="mono" font-size="9" font-weight="600" fill="#22D3EE">[SLA: &lt; 24H INITIAL TRIAGE]</text>

  <!-- ==================== CELL 3: DISCLOSURE ETHICS ==================== -->
  <rect x="592" y="48" width="268" height="82" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
  <text x="606" y="66" class="mono" font-size="9.5" font-weight="700" fill="#E3B341">03 // ETHICAL SAFE HARBOR</text>
  <text x="606" y="86" class="sans" font-size="12" font-weight="700" fill="#F0F6FC">Coordinated Disclosure</text>
  <text x="606" y="103" class="sans" font-size="10.5" fill="#8B949E">Responsible triage, no DDoS / disruption</text>
  <text x="606" y="120" class="mono" font-size="9" font-weight="600" fill="#E3B341">[LEGAL SAFE HARBOR PLEDGED]</text>

  <!-- Footer Terminal Bar -->
  <line x1="20" y1="142" x2="860" y2="142" stroke="#21262D" stroke-width="1" />
  <g transform="translate(20, 157)">
    <text x="0" y="0" class="mono" font-size="9.5" fill="#8B949E">$ security --policy safe-harbor --scope *.thenudasahas.site</text>
    <text x="840" y="0" class="mono" font-size="9.5" font-weight="700" fill="#39D353" text-anchor="end">[PROTECTION GUARANTEED 🇱🇰]</text>
  </g>
</svg>