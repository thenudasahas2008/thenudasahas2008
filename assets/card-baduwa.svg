<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame (Monochrome Dark) -->
  <rect x="1.5" y="1.5" width="437" height="237" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 22)">
    <!-- Minimalist Disc Icon -->
    <g transform="translate(0, 2)">
      <circle cx="11" cy="11" r="10" fill="#161B22" stroke="#8B949E" stroke-width="1.4" />
      <circle cx="11" cy="11" r="3.5" fill="#C9D1D9" />
      <path d="M 23 7 C 25 9 25 13 23 15" stroke="#8B949E" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- Project Title & Subtitle -->
    <text x="34" y="14" class="sans" font-size="17" font-weight="700" fill="#F0F6FC" letter-spacing="0.3">Baduwa (ZYRO)</text>
    <text x="34" y="27" class="mono" font-size="9" font-weight="600" fill="#8B949E" letter-spacing="0.6">24/7 DISCORD AUDIO ENGINE &amp; AUTOMATION BOT</text>

    <!-- Status Pill (Monochrome) -->
    <rect x="286" y="0" width="106" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="297" cy="11" r="3" fill="#E6EDF3" />
    <text x="306" y="14.5" class="mono" font-size="8.5" font-weight="700" fill="#C9D1D9" letter-spacing="0.5">24/7 ONLINE</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="60" x2="420" y2="60" stroke="#21262D" stroke-width="1" />

  <!-- Core Description -->
  <g transform="translate(24, 80)">
    <text class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      High-fidelity Discord audio streaming bot with interactive
    </text>
    <text y="18" class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      button controls, low-latency playback buffering, and slash commands.
    </text>
  </g>

  <!-- Technical Metric Cards (Monochrome) -->
  <g transform="translate(24, 118)">
    <!-- Box 1 -->
    <rect width="186" height="38" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="12" y="15" class="mono" font-size="8.5" fill="#8B949E" font-weight="600">AUDIO AVAILABILITY</text>
    <text x="12" y="30" class="sans" font-size="11.5" fill="#F0F6FC" font-weight="600">24/7 Continuous Stream</text>

    <!-- Box 2 -->
    <rect x="198" width="194" height="38" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="210" y="15" class="mono" font-size="8.5" fill="#8B949E" font-weight="600">USER INTERFACE</text>
    <text x="210" y="30" class="sans" font-size="11.5" fill="#F0F6FC" font-weight="600">In-Discord Button UI</text>
  </g>

  <!-- Tech Stack Pills (Monochrome) -->
  <g transform="translate(24, 170)">
    <!-- Pill 1: JavaScript -->
    <rect width="82" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="41" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">JavaScript</text>

    <!-- Pill 2: Node.js -->
    <rect x="90" width="76" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="128" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">Node.js</text>

    <!-- Pill 3: Discord.js -->
    <rect x="174" width="90" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="219" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">Discord API</text>

    <!-- Pill 4: Async Audio -->
    <rect x="272" width="94" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="319" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">Async Audio</text>
  </g>

  <!-- Footer Link Strip -->
  <line x1="20" y1="204" x2="420" y2="204" stroke="#21262D" stroke-width="1" />
  <g transform="translate(24, 222)">
    <!-- GitHub Repo Text -->
    <text x="0" y="2" class="mono" font-size="10" fill="#8B949E" font-weight="500">thenudasahas2008 / Baduwa</text>

    <!-- Action Button (Monochrome) -->
    <rect x="278" y="-12" width="114" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="335" y="3" class="mono" font-size="9" font-weight="700" fill="#F0F6FC" text-anchor="middle">EXPLORE REPO ↗</text>
  </g>
</svg>
