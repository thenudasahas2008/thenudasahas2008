<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bdBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150E26" />
      <stop offset="50%" stop-color="#1B1433" />
      <stop offset="100%" stop-color="#0E0A1A" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="bdBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Top Accent Line -->
    <linearGradient id="bdTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="436" height="236" rx="12" fill="url(#bdBgGrad)" stroke="url(#bdBorder)" stroke-width="1.6" />
  
  <!-- Glowing Top Laser Line -->
  <rect x="12" y="2" width="416" height="3" rx="1.5" fill="url(#bdTopLine)" />

  <!-- Corner Tech Accents -->
  <path d="M 12 14 L 22 14 M 12 14 L 12 24" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 428 14 L 418 14 M 428 14 L 428 24" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" />

  <!-- Header Section -->
  <g transform="translate(24, 22)">
    <!-- Audio Waveform / Disc Icon -->
    <g transform="translate(0, 2)">
      <circle cx="11" cy="11" r="10" fill="#2E1065" stroke="#A78BFA" stroke-width="1.6" />
      <circle cx="11" cy="11" r="4" fill="#C4B5FD" />
      <!-- Sound Wave accents -->
      <path d="M 23 7 C 25 9 25 13 23 15" stroke="#C4B5FD" stroke-width="1.4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Project Title & Subtitle -->
    <text x="34" y="14" class="sans" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="0.4">Baduwa (ZYRO)</text>
    <text x="34" y="27" class="mono" font-size="9.5" font-weight="700" fill="#C4B5FD" letter-spacing="0.8">24/7 DISCORD AUDIO ENGINE &amp; AUTOMATION BOT</text>

    <!-- Status Pill -->
    <rect x="282" y="0" width="110" height="22" rx="11" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.2" />
    <circle cx="293" cy="11" r="3.5" fill="#A855F7" />
    <text x="301" y="14.5" class="mono" font-size="9" font-weight="800" fill="#E9D5FF" letter-spacing="0.5">24/7 ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="60" x2="420" y2="60" stroke="#2B1D45" stroke-width="1.2" />

  <!-- Core Description -->
  <g transform="translate(24, 80)">
    <text class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      High-fidelity Discord audio streaming bot with interactive
    </text>
    <text y="18" class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      button controls, low-latency playback buffering, and slash commands.
    </text>
  </g>

  <!-- Technical Metric Cards -->
  <g transform="translate(24, 118)">
    <!-- Box 1 -->
    <rect width="186" height="38" rx="7" fill="#18112C" stroke="#372659" stroke-width="1.2" />
    <text x="12" y="15" class="mono" font-size="8.5" fill="#A78BFA" font-weight="700">AUDIO AVAILABILITY</text>
    <text x="12" y="30" class="sans" font-size="11.5" fill="#C4B5FD" font-weight="700">24/7 Continuous Stream</text>

    <!-- Box 2 -->
    <rect x="198" width="194" height="38" rx="7" fill="#18112C" stroke="#372659" stroke-width="1.2" />
    <text x="210" y="15" class="mono" font-size="8.5" fill="#A78BFA" font-weight="700">USER INTERFACE</text>
    <text x="210" y="30" class="sans" font-size="11.5" fill="#F472B6" font-weight="700">In-Discord Button UI</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 170)">
    <!-- Pill 1: JavaScript -->
    <rect width="82" height="22" rx="5" fill="#2E2405" stroke="#FACC15" stroke-width="1" />
    <text x="41" y="15" class="mono" font-size="10" fill="#FACC15" font-weight="700" text-anchor="middle">JavaScript</text>

    <!-- Pill 2: Node.js -->
    <rect x="90" width="76" height="22" rx="5" fill="#0C2E1A" stroke="#4ADE80" stroke-width="1" />
    <text x="128" y="15" class="mono" font-size="10" fill="#4ADE80" font-weight="700" text-anchor="middle">Node.js</text>

    <!-- Pill 3: Discord.js -->
    <rect x="174" width="90" height="22" rx="5" fill="#1D1A3F" stroke="#818CF8" stroke-width="1" />
    <text x="219" y="15" class="mono" font-size="10" fill="#A5B4FC" font-weight="700" text-anchor="middle">Discord API</text>

    <!-- Pill 4: Async Audio -->
    <rect x="272" width="94" height="22" rx="5" fill="#2E0C24" stroke="#F472B6" stroke-width="1" />
    <text x="319" y="15" class="mono" font-size="10" fill="#FBCFE8" font-weight="700" text-anchor="middle">Async Audio</text>
  </g>

  <!-- Footer Link Strip -->
  <line x1="20" y1="204" x2="420" y2="204" stroke="#2B1D45" stroke-width="1.2" />
  <g transform="translate(24, 222)">
    <!-- GitHub Repo Text -->
    <text x="0" y="2" class="mono" font-size="10.5" fill="#94A3B8" font-weight="600">thenudasahas2008 / Baduwa</text>

    <!-- Action Button -->
    <rect x="272" y="-12" width="120" height="22" rx="6" fill="#2A1747" stroke="#A78BFA" stroke-width="1.2" />
    <text x="332" y="3" class="mono" font-size="9.5" font-weight="800" fill="#C4B5FD" text-anchor="middle">EXPLORE REPO ↗</text>
  </g>
</svg>
