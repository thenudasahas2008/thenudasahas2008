<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00bfa6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00bfa6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepPulse {
      0% { transform: translateX(-100px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateX(900px); opacity: 0.3; }
    }
    .scanner-dot {
      animation: sweepPulse 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Base Line -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#divGrad)" stroke-width="1.8" filter="url(#divGlow)"/>
  
  <!-- Center Diamond & Mini Impostor Silhouette -->
  <polygon points="450,4 458,12 450,20 442,12" fill="#22d3ee" filter="url(#divGlow)"/>
  <circle cx="430" cy="12" r="2" fill="#00bfa6"/>
  <circle cx="470" cy="12" r="2" fill="#00bfa6"/>

  <!-- Moving glowing pulse -->
  <circle cx="0" cy="12" r="3" fill="#ffffff" filter="url(#divGlow)" class="scanner-dot"/>
</svg>
