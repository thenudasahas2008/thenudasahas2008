<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .prompt-user { fill: #22D3EE; font-weight: 700; }
      .prompt-host { fill: #58A6FF; font-weight: 600; }
      .prompt-cmd  { fill: #39D353; font-weight: 700; }
      .spec-key    { fill: #22D3EE; font-weight: 700; font-size: 11px; }
      .spec-val    { fill: #F0F6FC; font-weight: 500; font-size: 11px; }
      .spec-sub    { fill: #8B949E; font-weight: 400; font-size: 11px; }
    </style>

    <!-- Kali Neon Cyan-Blue Gradient for Logo -->
    <linearGradient id="kaliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Glow for Active Elements -->
    <filter id="terminalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Container -->
  <rect x="1.5" y="1.5" width="877" height="342" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Terminal Top Bar -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 36 L 1.5 36 Z" fill="#161B22" />
  <line x1="1.5" y1="36" x2="878.5" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="19" r="4.5" fill="#27C93F" />

  <!-- Window Title -->
  <text x="74" y="23" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    sahas@cyber-forensics: ~ (zsh) — neofetch
  </text>

  <!-- Live Status Badge Right -->
  <rect x="715" y="9" width="145" height="20" rx="10" fill="#0E4429" stroke="#238636" stroke-width="1" />
  <circle cx="727" cy="19" r="3.5" fill="#39D353" filter="url(#terminalGlow)" />
  <text x="737" y="23" class="mono" font-size="9" font-weight="700" fill="#39D353">PERIMETERS ACTIVE [OK]</text>

  <!-- Shell Prompt Row -->
  <g transform="translate(24, 60)" class="mono" font-size="11.5">
    <text x="0" y="0">
      <tspan fill="#58A6FF">┌──(</tspan>
      <tspan fill="#22D3EE" font-weight="700">sahas㉿cyber-forensics</tspan>
      <tspan fill="#58A6FF">)-[</tspan>
      <tspan fill="#F0F6FC">~</tspan>
      <tspan fill="#58A6FF">]</tspan>
    </text>
    <text x="0" y="18">
      <tspan fill="#58A6FF">└─$</tspan>
      <tspan fill="#39D353" font-weight="700"> neofetch --profile --cyber-defense</tspan>
    </text>
  </g>

  <!-- ==================== LEFT: KALI / DEBIAN ASCII ART ==================== -->
  <g transform="translate(24, 106)" class="mono" font-size="10.5" font-weight="700" fill="url(#kaliGrad)">
    <text x="0" y="0">       _,met$$$$$gg.</text>
    <text x="0" y="14">    ,g$$$$$$$$$$$$$$$P.</text>
    <text x="0" y="28">  ,g$$P"     """Y$$.". </text>
    <text x="0" y="42"> ,$$P'              `$$$.</text>
    <text x="0" y="56">',$$P       ,ggs.     `$$b:</text>
    <text x="0" y="70">`d$$'     ,$P"'   .    $$$</text>
    <text x="0" y="84"> $$P      d$'     ,    $$P</text>
    <text x="0" y="98"> $$:      $$.   -    ,d$$'</text>
    <text x="0" y="112"> $$;      Y$b._   _,d$P'</text>
    <text x="0" y="126"> Y$$.    `.`"Y$$$$P"'</text>
    <text x="0" y="140">  `$$b      "-.__</text>
    <text x="0" y="154">   `Y$$b</text>
    <text x="0" y="168">    `"Y$b._</text>
    <text x="0" y="182">        `"""</text>
  </g>

  <!-- ==================== RIGHT: SYSTEM SPECS MATRIX ==================== -->
  <g transform="translate(235, 106)" class="mono">
    <!-- OS -->
    <text x="0" y="0" class="spec-key">OS</text>
    <text x="80" y="0" class="spec-sub">:</text>
    <text x="96" y="0" class="spec-val">Kali GNU/Linux / Ubuntu LTS x86_64</text>

    <!-- Host -->
    <text x="0" y="17" class="spec-key">Host</text>
    <text x="80" y="17" class="spec-sub">:</text>
    <text x="96" y="17" class="spec-val">Digital Forensics &amp; Defense Lab</text>

    <!-- Kernel -->
    <text x="0" y="34" class="spec-key">Kernel</text>
    <text x="80" y="34" class="spec-sub">:</text>
    <text x="96" y="34" class="spec-val">6.8.0-security-hardened</text>

    <!-- Uptime -->
    <text x="0" y="51" class="spec-key">Uptime</text>
    <text x="80" y="51" class="spec-sub">:</text>
    <text x="96" y="51" class="spec-val">Always Learning &amp; Defending Perimeters</text>

    <!-- Shell -->
    <text x="0" y="68" class="spec-key">Shell</text>
    <text x="80" y="68" class="spec-sub">:</text>
    <text x="96" y="68" class="spec-val">zsh 5.9 (x86_64-debian-linux-gnu)</text>

    <!-- Name -->
    <text x="0" y="85" class="spec-key">Name</text>
    <text x="80" y="85" class="spec-sub">:</text>
    <text x="96" y="85" class="spec-val" font-weight="700">Thenuda Sahas Sooriyaarachchi</text>

    <!-- Degree -->
    <text x="0" y="102" class="spec-key">Degree</text>
    <text x="80" y="102" class="spec-sub">:</text>
    <text x="96" y="102" class="spec-val" fill="#58A6FF">Pearson BTEC HND in Computing 🎓</text>

    <!-- Focus -->
    <text x="0" y="119" class="spec-key">Focus</text>
    <text x="80" y="119" class="spec-sub">:</text>
    <text x="96" y="119" class="spec-val" fill="#22D3EE">Cybersecurity • Digital Forensics (DFIR) 🛡️</text>

    <!-- Core Tools -->
    <text x="0" y="136" class="spec-key">Core Tools</text>
    <text x="80" y="136" class="spec-sub">:</text>
    <text x="96" y="136" class="spec-val">Wireshark • Python • Bash • Linux Hardening</text>

    <!-- Key Project -->
    <text x="0" y="153" class="spec-key">Key Project</text>
    <text x="80" y="153" class="spec-sub">:</text>
    <text x="96" y="153" class="spec-val" fill="#E3B341">PromptSentry (AI Heuristic Firewall)</text>

    <!-- Status -->
    <text x="0" y="170" class="spec-key">Status</text>
    <text x="80" y="170" class="spec-sub">:</text>
    <text x="96" y="170" class="spec-val" fill="#39D353" font-weight="700">Defensive Perimeters Active [OK] ✔</text>

    <!-- Location -->
    <text x="0" y="187" class="spec-key">Location</text>
    <text x="80" y="187" class="spec-sub">:</text>
    <text x="96" y="187" class="spec-val">Colombo, Sri Lanka 🇱🇰 (UTC+05:30)</text>
  </g>

  <!-- ==================== BOTTOM PALETTE BLOCKS (NEOFETCH STYLE) ==================== -->
  <g transform="translate(235, 308)">
    <rect x="0" y="0" width="22" height="12" rx="2" fill="#161B22" />
    <rect x="26" y="0" width="22" height="12" rx="2" fill="#FF5F56" />
    <rect x="52" y="0" width="22" height="12" rx="2" fill="#27C93F" />
    <rect x="78" y="0" width="22" height="12" rx="2" fill="#FFBD2E" />
    <rect x="104" y="0" width="22" height="12" rx="2" fill="#58A6FF" />
    <rect x="130" y="0" width="22" height="12" rx="2" fill="#BC8CFF" />
    <rect x="156" y="0" width="22" height="12" rx="2" fill="#22D3EE" />
    <rect x="182" y="0" width="22" height="12" rx="2" fill="#F0F6FC" />

    <!-- Bright Variants -->
    <rect x="220" y="0" width="22" height="12" rx="2" fill="#484F58" />
    <rect x="246" y="0" width="22" height="12" rx="2" fill="#FFA198" />
    <rect x="272" y="0" width="22" height="12" rx="2" fill="#7EE787" />
    <rect x="298" y="0" width="22" height="12" rx="2" fill="#F2CC60" />
    <rect x="324" y="0" width="22" height="12" rx="2" fill="#79C0FF" />
    <rect x="350" y="0" width="22" height="12" rx="2" fill="#D2A8FF" />
    <rect x="376" y="0" width="22" height="12" rx="2" fill="#67E8F9" />
    <rect x="402" y="0" width="22" height="12" rx="2" fill="#FFFFFF" />
  </g>
</svg>