<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 235" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16" />
      <stop offset="50%" stop-color="#0B1322" />
      <stop offset="100%" stop-color="#060A13" />
    </linearGradient>

    <!-- Laser Top Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00BFA6" stop-opacity="0" />
    </linearGradient>

    <!-- Spectrum Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="70%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Animation: Radar Sweep */
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .radar-sweep {
        transform-origin: 110px 105px;
        animation: radarRotate 3.5s linear infinite;
      }

      /* Animation: Blip Pulse */
      @keyframes blipPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .blip-1 { animation: blipPulse 2s ease-in-out infinite; transform-origin: 125px 90px; }
      .blip-2 { animation: blipPulse 2.5s ease-in-out infinite 0.7s; transform-origin: 95px 120px; }
      .blip-3 { animation: blipPulse 1.8s ease-in-out infinite 1.2s; transform-origin: 130px 115px; }

      /* Animation: Spectrum Wave Bars */
      @keyframes waveBar {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }
      .b1 { transform-origin: bottom; animation: waveBar 1.6s ease-in-out infinite 0.1s; }
      .b2 { transform-origin: bottom; animation: waveBar 1.4s ease-in-out infinite 0.3s; }
      .b3 { transform-origin: bottom; animation: waveBar 1.8s ease-in-out infinite 0.5s; }
      .b4 { transform-origin: bottom; animation: waveBar 1.3s ease-in-out infinite 0.2s; }
      .b5 { transform-origin: bottom; animation: waveBar 1.7s ease-in-out infinite 0.6s; }
      .b6 { transform-origin: bottom; animation: waveBar 1.5s ease-in-out infinite 0.4s; }
      .b7 { transform-origin: bottom; animation: waveBar 1.9s ease-in-out infinite 0.7s; }
      .b8 { transform-origin: bottom; animation: waveBar 1.4s ease-in-out infinite 0.2s; }
      .b9 { transform-origin: bottom; animation: waveBar 1.6s ease-in-out infinite 0.5s; }
      .b10 { transform-origin: bottom; animation: waveBar 1.8s ease-in-out infinite 0.8s; }
      .b11 { transform-origin: bottom; animation: waveBar 1.3s ease-in-out infinite 0.3s; }
      .b12 { transform-origin: bottom; animation: waveBar 1.7s ease-in-out infinite 0.6s; }
      .b13 { transform-origin: bottom; animation: waveBar 1.5s ease-in-out infinite 0.4s; }
      .b14 { transform-origin: bottom; animation: waveBar 1.9s ease-in-out infinite 0.7s; }

      /* Animation: Live Beacon Pulse */
      @keyframes beaconRing {
        0% { r: 3; opacity: 1; }
        100% { r: 9; opacity: 0; }
      }
      .beacon-wave {
        animation: beaconRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      /* Animation: Cursor Blink */
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor { animation: cursorBlink 1s infinite; }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="1.5" y="1.5" width="877" height="232" rx="10" fill="url(#hudBg)" stroke="#30363D" stroke-width="1.3" />
  
  <!-- Glowing Laser Top Accent -->
  <rect x="10" y="1.5" width="860" height="2.5" rx="1.2" fill="url(#laserGrad)" />

  <!-- Window Header Bar -->
  <g transform="translate(20, 18)">
    <!-- Terminal Dots -->
    <circle cx="6" cy="6" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="20" cy="6" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="34" cy="6" r="4.5" fill="#10B981" opacity="0.85" />

    <!-- Terminal Title -->
    <text x="52" y="10" class="mono" font-size="11" font-weight="700" fill="#8B949E" letter-spacing="0.6">
      THENUDA SAHAS // REAL-TIME CYBER TELEMETRY &amp; ACTIVITY ENGINE
    </text>

    <!-- Live Animated Beacon -->
    <g transform="translate(710, -2)">
      <rect width="134" height="22" rx="11" fill="#042F2E" stroke="#10B981" stroke-width="1.2" />
      <circle cx="14" cy="11" r="7" stroke="#22D3EE" stroke-width="1.2" fill="none" class="beacon-wave" />
      <circle cx="14" cy="11" r="3.5" fill="#22D3EE" />
      <text x="26" y="14.5" class="mono" font-size="8.5" font-weight="700" fill="#6EE7B7">STREAM ACTIVE</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="1" y1="38" x2="879" y2="38" stroke="#1E293B" stroke-width="1.2" />

  <!-- ==================== PANEL 1: LIVE RADAR THREAT SCANNER ==================== -->
  <g transform="translate(18, 50)">
    <rect width="230" height="138" rx="8" fill="#0D1524" stroke="#1E2E4A" stroke-width="1.2" />
    <text x="12" y="18" class="mono" font-size="8.5" font-weight="700" fill="#22D3EE">01 // THREAT RADAR SCANNER</text>

    <!-- Radar Scope Center (115, 75) -->
    <g transform="translate(5, -5)">
      <!-- Radar Rings -->
      <circle cx="110" cy="72" r="38" stroke="#1E3A5F" stroke-width="1.2" fill="#07101E" />
      <circle cx="110" cy="72" r="26" stroke="#1E3A5F" stroke-width="0.8" fill="none" />
      <circle cx="110" cy="72" r="14" stroke="#1E3A5F" stroke-width="0.8" fill="none" />
      
      <!-- Crosshairs -->
      <line x1="72" y1="72" x2="148" y2="72" stroke="#1E3A5F" stroke-width="0.8" />
      <line x1="110" y1="34" x2="110" y2="110" stroke="#1E3A5F" stroke-width="0.8" />

      <!-- Animated Rotating Sweep Line -->
      <g class="radar-sweep">
        <line x1="110" y1="72" x2="148" y2="72" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
        <path d="M 110 72 L 148 72 A 38 38 0 0 0 144 50 Z" fill="url(#sweepGrad)" opacity="0.4" />
      </g>

      <!-- Animated Target Blips -->
      <circle cx="125" cy="60" r="3" fill="#34D399" class="blip-1" />
      <circle cx="95" cy="85" r="2.5" fill="#22D3EE" class="blip-2" />
      <circle cx="130" cy="82" r="2.5" fill="#38BDF8" class="blip-3" />
    </g>

    <!-- Radar Status Footer -->
    <text x="115" y="128" class="mono" font-size="8.5" fill="#34D399" font-weight="700" text-anchor="middle">
      [✓ DEFENSE PERIMETER: ZERO COMPROMISE]
    </text>
  </g>

  <!-- ==================== PANEL 2: ANIMATED VELOCITY SPECTRUM ==================== -->
  <g transform="translate(262, 50)">
    <rect width="324" height="138" rx="8" fill="#0D1524" stroke="#1E2E4A" stroke-width="1.2" />
    <text x="14" y="18" class="mono" font-size="8.5" font-weight="700" fill="#22D3EE">02 // CODE VELOCITY &amp; ACTIVITY</text>

    <!-- Big Metric & Badge -->
    <g transform="translate(14, 28)">
      <text x="0" y="24" class="sans" font-size="26" font-weight="800" fill="#F0F6FC">87+</text>
      <text x="58" y="14" class="sans" font-size="11" font-weight="700" fill="#58A6FF">Production Commits</text>
      <text x="58" y="26" class="sans" font-size="9.5" fill="#8B949E">100+ Total Contributions • 7 PRs Merged</text>
    </g>

    <!-- Animated Equalizer Spectrum Bars -->
    <g transform="translate(14, 62)">
      <text x="0" y="14" class="mono" font-size="8.5" fill="#8B949E">ACTIVITY SPECTRUM:</text>
      <g transform="translate(100, 16)">
        <rect x="0" y="-18" width="8" height="18" rx="2" fill="url(#barGrad)" class="b1" />
        <rect x="12" y="-22" width="8" height="22" rx="2" fill="url(#barGrad)" class="b2" />
        <rect x="24" y="-15" width="8" height="15" rx="2" fill="url(#barGrad)" class="b3" />
        <rect x="36" y="-26" width="8" height="26" rx="2" fill="url(#barGrad)" class="b4" />
        <rect x="48" y="-19" width="8" height="19" rx="2" fill="url(#barGrad)" class="b5" />
        <rect x="60" y="-28" width="8" height="28" rx="2" fill="url(#barGrad)" class="b6" />
        <rect x="72" y="-16" width="8" height="16" rx="2" fill="url(#barGrad)" class="b7" />
        <rect x="84" y="-24" width="8" height="24" rx="2" fill="url(#barGrad)" class="b8" />
        <rect x="96" y="-30" width="8" height="30" rx="2" fill="url(#barGrad)" class="b9" />
        <rect x="108" y="-18" width="8" height="18" rx="2" fill="url(#barGrad)" class="b10" />
        <rect x="120" y="-25" width="8" height="25" rx="2" fill="url(#barGrad)" class="b11" />
        <rect x="132" y="-22" width="8" height="22" rx="2" fill="url(#barGrad)" class="b12" />
        <rect x="144" y="-28" width="8" height="28" rx="2" fill="url(#barGrad)" class="b13" />
        <rect x="156" y="-19" width="8" height="19" rx="2" fill="url(#barGrad)" class="b14" />
      </g>
    </g>

    <!-- Language Distribution Strip -->
    <g transform="translate(14, 104)">
      <!-- Progress Line -->
      <rect width="296" height="5" rx="2.5" fill="#21262D" />
      <rect width="284" height="5" rx="2.5" fill="#F1E05A" />
      <rect x="284" width="9" height="5" fill="#3572A5" />
      <rect x="293" width="3" height="5" rx="1.5" fill="#89E051" />

      <text x="0" y="22" class="sans" font-size="10" fill="#C9D1D9">
        <tspan fill="#F1E05A" font-weight="700">●</tspan> JS 96.6% &#160;
        <tspan fill="#3572A5" font-weight="700">●</tspan> Python 2.1% &#160;
        <tspan fill="#89E051" font-weight="700">●</tspan> Bash &#160;
        <tspan fill="#8B949E">| Discord Bot &amp; AI Security Engines</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== PANEL 3: ACADEMIC & SECURITY ARCHITECTURE ==================== -->
  <g transform="translate(600, 50)">
    <rect width="262" height="138" rx="8" fill="#0D1524" stroke="#1E2E4A" stroke-width="1.2" />
    <text x="14" y="18" class="mono" font-size="8.5" font-weight="700" fill="#22D3EE">03 // DOMAIN &amp; RESEARCH</text>

    <g transform="translate(14, 38)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="700" fill="#F0F6FC">🎓 Pearson BTEC HND</text>
      <text x="0" y="15" class="sans" font-size="10" fill="#8B949E">Computing &amp; Security Engineering</text>

      <text x="0" y="38" class="sans" font-size="11" fill="#C9D1D9">🛡️ PromptSentry — AI Defense</text>
      <text x="0" y="55" class="sans" font-size="11" fill="#C9D1D9">🔍 Wireshark DFIR Packet Triage</text>
      <text x="0" y="72" class="sans" font-size="11" fill="#C9D1D9">🔐 SHA-256 Evidence Integrity</text>
      <text x="0" y="87" class="mono" font-size="9" font-weight="700" fill="#34D399">Defensive Systems: ARMED [OK]</text>
    </g>
  </g>

  <!-- ==================== FOOTER COMMAND TERMINAL ==================== -->
  <line x1="1" y1="200" x2="879" y2="200" stroke="#1E293B" stroke-width="1.2" />
  <g transform="translate(20, 218)">
    <text x="0" y="0" class="mono" font-size="10" fill="#22D3EE" font-weight="700">$</text>
    <text x="14" y="0" class="mono" font-size="10" fill="#C9D1D9">stream-telemetry --user thenudasahas2008 --live</text>
    <!-- Blinking Cursor -->
    <rect x="335" y="-10" width="7" height="13" fill="#22D3EE" class="cursor" />

    <text x="470" y="0" class="mono" font-size="9.5" fill="#34D399" font-weight="700">[✓ REAL-TIME STREAM ACTIVE • ZERO VULNERABILITIES DETECTED]</text>
  </g>
</svg>
