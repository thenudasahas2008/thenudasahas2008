<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      /* Animation: Laser Scan Beam */
      @keyframes laserScan {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.65; }
        85% { opacity: 0.65; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      .scan-beam {
        animation: laserScan 4s ease-in-out infinite;
      }

      /* Animation: Progress Bar Shimmer */
      @keyframes shimmerMove {
        0% { transform: translateX(-180px); }
        100% { transform: translateX(260px); }
      }
      .shimmer-track {
        animation: shimmerMove 2.6s ease-in-out infinite;
      }

      /* Animation: Target Reticle Rotate */
      @keyframes reticleRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .reticle-spin {
        transform-origin: 825px 95px;
        animation: reticleRotate 6s linear infinite;
      }

      /* Animation: Glowing LED Pulse */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; filter: drop-shadow(0 0 5px #39D353); }
      }
      .led-pulse {
        animation: pulseGlow 2s ease-in-out infinite;
      }

      /* Animation: Cyber Node Pulse */
      @keyframes nodeBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .node-1 { animation: nodeBlink 1.8s ease-in-out infinite; }
      .node-2 { animation: nodeBlink 2.2s ease-in-out infinite 0.7s; }
    </style>

    <!-- Hologram Cyan & Emerald Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Pattern -->
    <pattern id="cardGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#21262D" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Clip Path for Progress Bar Shimmer -->
    <clipPath id="progressClip">
      <rect x="34" y="186" width="192" height="7" rx="3.5" />
    </clipPath>
  </defs>

  <!-- Outer Tactical HUD Container -->
  <rect x="1.5" y="1.5" width="877" height="267" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.3" />

  <!-- Animated Laser Scanning Beam -->
  <line x1="2" y1="15" x2="878" y2="15" stroke="url(#beamGrad)" stroke-width="2" class="scan-beam" />

  <!-- Top Tactical Header Bar -->
  <path d="M 1.5 10 A 8.5 8.5 0 0 1 10 1.5 L 870 1.5 A 8.5 8.5 0 0 1 878.5 10 L 878.5 36 L 1.5 36 Z" fill="#161B22" />
  <line x1="1.5" y1="36" x2="878.5" y2="36" stroke="#30363D" stroke-width="1" />

  <!-- Window Traffic Lights -->
  <circle cx="20" cy="19" r="4.5" fill="#FF5F56" />
  <circle cx="36" cy="19" r="4.5" fill="#FFBD2E" />
  <circle cx="52" cy="19" r="4.5" fill="#27C93F" />

  <!-- Header Title -->
  <text x="74" y="23" class="mono" font-size="11" font-weight="700" fill="#8B949E">
    THENUDA SAHAS // STRATEGIC ACADEMIC &amp; CERTIFICATION ROADMAP [2026 - 2027]
  </text>

  <!-- Live Status Badge Right -->
  <rect x="735" y="9" width="125" height="20" rx="10" fill="#0E4429" stroke="#238636" stroke-width="1" />
  <circle cx="747" cy="19" r="3.5" fill="#39D353" class="led-pulse" />
  <text x="758" y="23" class="mono" font-size="9" font-weight="700" fill="#39D353">ROADMAP ACTIVE</text>

  <!-- ==================== COLUMN 1: HIGHER EDUCATION ==================== -->
  <g transform="translate(20, 48)">
    <rect width="268" height="172" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect width="268" height="172" rx="8" fill="url(#cardGrid)" />

    <!-- Pod Header -->
    <text x="16" y="22" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE">01 // HIGHER EDUCATION</text>
    <line x1="16" y1="28" x2="252" y2="28" stroke="#21262D" stroke-width="1" />

    <!-- Degree Title -->
    <text x="16" y="48" class="sans" font-size="14" font-weight="700" fill="#F0F6FC">Pearson BTEC HND 🎓</text>
    <text x="16" y="64" class="sans" font-size="11" font-weight="500" fill="#8B949E">Computing (Cybersecurity &amp; Systems)</text>

    <!-- Bullet Points -->
    <g transform="translate(16, 80)" class="sans" font-size="11" fill="#C9D1D9">
      <text y="0">• Network Engineering &amp; Protocols</text>
      <text y="17">• Secure Database Architecture</text>
      <text y="34">• Software Engineering &amp; OOP</text>
    </g>

    <!-- Academic Progress Bar with Live Animated Shimmer -->
    <g transform="translate(14, 138)">
      <rect width="240" height="7" rx="3.5" fill="#21262D" />
      <rect width="192" height="7" rx="3.5" fill="#22D3EE" />

      <!-- Shimmer Wave Overlay -->
      <g clip-path="url(#progressClip)">
        <rect x="0" y="0" width="80" height="7" fill="url(#shimmerGrad)" class="shimmer-track" />
      </g>

      <text x="240" y="-5" class="mono" font-size="9" fill="#22D3EE" font-weight="700" text-anchor="end">80% IN PROGRESS</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: DFIR APPLIED LABS ==================== -->
  <g transform="translate(306, 48)">
    <rect width="268" height="172" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect width="268" height="172" rx="8" fill="url(#cardGrid)" />

    <!-- Pod Header -->
    <text x="16" y="22" class="mono" font-size="9.5" font-weight="700" fill="#A371F7">02 // APPLIED DFIR LABS</text>
    <line x1="16" y1="28" x2="252" y2="28" stroke="#21262D" stroke-width="1" />

    <!-- Labs Title -->
    <text x="16" y="48" class="sans" font-size="14" font-weight="700" fill="#F0F6FC">Defensive Security Labs 🛡️</text>
    <text x="16" y="64" class="sans" font-size="11" font-weight="500" fill="#8B949E">Incident Response &amp; Forensics Research</text>

    <!-- Lab Highlights -->
    <g transform="translate(16, 80)" class="sans" font-size="11" fill="#C9D1D9">
      <text y="0">• Digital Evidence &amp; Chain-of-Custody</text>
      <text y="17">• Linux Hardening &amp; Bash Automation</text>
      <text y="34">• Wireshark Deep Packet Inspection</text>
    </g>

    <!-- Status Tag Bottom -->
    <g transform="translate(14, 134)">
      <rect width="240" height="20" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="28" cy="10" r="3.5" fill="#A371F7" class="node-1" />
      <text x="38" y="13.5" class="mono" font-size="9" font-weight="700" fill="#A371F7">PRACTICAL RESEARCH &amp; THREAT TRIAGE</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: TARGET CREDENTIALS ==================== -->
  <g transform="translate(592, 48)">
    <rect width="268" height="172" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <rect width="268" height="172" rx="8" fill="url(#cardGrid)" />

    <!-- Pod Header -->
    <text x="16" y="22" class="mono" font-size="9.5" font-weight="700" fill="#38BDF8">03 // TARGET CREDENTIALS</text>
    <line x1="16" y1="28" x2="252" y2="28" stroke="#21262D" stroke-width="1" />

    <!-- Target Reticle Icon Top Right -->
    <g class="reticle-spin">
      <circle cx="825" cy="95" r="9" fill="none" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="3,3" />
      <circle cx="825" cy="95" r="3" fill="#22D3EE" />
      <line x1="825" y1="83" x2="825" y2="107" stroke="#22D3EE" stroke-width="1" />
      <line x1="813" y1="95" x2="837" y2="95" stroke="#22D3EE" stroke-width="1" />
    </g>

    <!-- Certifications List -->
    <g transform="translate(16, 48)" class="sans" font-size="11.5">
      <!-- CompTIA Security+ -->
      <g transform="translate(0, 0)">
        <text y="0" font-weight="700" fill="#F0F6FC">🎯 CompTIA Security+</text>
        <rect x="175" y="-10" width="62" height="16" rx="8" fill="#1F242C" stroke="#F59E0B" stroke-width="0.8" />
        <text x="206" y="1" class="mono" font-size="8" font-weight="700" fill="#F59E0B" text-anchor="middle">[IN PREP]</text>
      </g>

      <!-- eJPT -->
      <g transform="translate(0, 24)">
        <text y="0" font-weight="700" fill="#F0F6FC">🛡️ eJPT (Junior Pentester)</text>
        <rect x="175" y="-10" width="62" height="16" rx="8" fill="#1F242C" stroke="#38BDF8" stroke-width="0.8" />
        <text x="206" y="1" class="mono" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">[ROADMAP]</text>
      </g>

      <!-- BTEC Degree -->
      <g transform="translate(0, 48)">
        <text y="0" font-weight="700" fill="#F0F6FC">🎓 Pearson BTEC HND</text>
        <rect x="175" y="-10" width="62" height="16" rx="8" fill="#1F242C" stroke="#39D353" stroke-width="0.8" />
        <text x="206" y="1" class="mono" font-size="8" font-weight="700" fill="#39D353" text-anchor="middle">[CANDIDATE]</text>
      </g>
    </g>

    <!-- Schedule Badge Bottom -->
    <g transform="translate(14, 134)">
      <rect width="240" height="20" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
      <circle cx="28" cy="10" r="3.5" fill="#38BDF8" class="node-2" />
      <text x="38" y="13.5" class="mono" font-size="9" font-weight="700" fill="#38BDF8">TARGET SCHEDULE: 2026 - 2027</text>
    </g>
  </g>

  <!-- ==================== BOTTOM COMMAND & TELEMETRY FOOTER ==================== -->
  <line x1="20" y1="234" x2="860" y2="234" stroke="#21262D" stroke-width="1" stroke-dasharray="3,3" />

  <g transform="translate(24, 252)" class="mono">
    <!-- Sleek Terminal Command -->
    <text x="0" y="0" font-size="10.5" fill="#39D353" font-weight="700">
      $ roadmap --view academic-milestones --target=certified
    </text>

    <!-- Sleek Telemetry Badges Right -->
    <text x="832" y="0" font-size="10" font-weight="700" fill="#39D353" text-anchor="end">
      [✔ 3 STRATEGIC PILLARS ON TRACK • LIVE AUDIT PASSED]
    </text>
  </g>
</svg>
