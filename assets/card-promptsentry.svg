<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="psBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="50%" stop-color="#0B1A33" />
      <stop offset="100%" stop-color="#050C1A" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="psBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Top Accent Line -->
    <linearGradient id="psTopLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA6" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="436" height="236" rx="12" fill="url(#psBgGrad)" stroke="url(#psBorder)" stroke-width="1.6" />
  
  <!-- Glowing Top Laser Line -->
  <rect x="12" y="2" width="416" height="3" rx="1.5" fill="url(#psTopLine)" />

  <!-- Corner Tech Accents -->
  <path d="M 12 14 L 22 14 M 12 14 L 12 24" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 428 14 L 418 14 M 428 14 L 428 24" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" />

  <!-- Header Section -->
  <g transform="translate(24, 22)">
    <!-- Cyber Shield Icon -->
    <g transform="translate(0, 2)">
      <path d="M 0 5 L 11 0 L 22 5 L 22 14 C 22 20 11 25 11 25 C 11 25 0 20 0 14 Z" fill="#0E384A" stroke="#22D3EE" stroke-width="1.6" />
      <path d="M 11 6 L 11 18 M 6 11 L 16 11" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Project Title & Subtitle -->
    <text x="32" y="14" class="sans" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="0.4">PromptSentry</text>
    <text x="32" y="27" class="mono" font-size="9.5" font-weight="700" fill="#22D3EE" letter-spacing="0.8">AI SECURITY GATEWAY &amp; HEURISTIC LLM FIREWALL</text>

    <!-- Status Pill -->
    <rect x="278" y="0" width="114" height="22" rx="11" fill="#042F2E" stroke="#14B8A6" stroke-width="1.2" />
    <circle cx="289" cy="11" r="3.5" fill="#2DD4BF" />
    <text x="297" y="14.5" class="mono" font-size="9" font-weight="800" fill="#5EEAD4" letter-spacing="0.5">DEFENSE ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="60" x2="420" y2="60" stroke="#1E2E4A" stroke-width="1.2" />

  <!-- Core Description -->
  <g transform="translate(24, 80)">
    <text class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      Production-grade AI firewall intercepting heuristic prompt
    </text>
    <text y="18" class="sans" font-size="12" fill="#E2E8F0" font-weight="500">
      injections, adversarial jailbreaks, and zero-day LLM exploits.
    </text>
  </g>

  <!-- Technical Metric Cards -->
  <g transform="translate(24, 118)">
    <!-- Box 1 -->
    <rect width="186" height="38" rx="7" fill="#0A162C" stroke="#1E3A5F" stroke-width="1.2" />
    <text x="12" y="15" class="mono" font-size="8.5" fill="#94A3B8" font-weight="700">MITIGATION SCOPE</text>
    <text x="12" y="30" class="sans" font-size="11.5" fill="#38BDF8" font-weight="700">OWASP LLM01 Defense</text>

    <!-- Box 2 -->
    <rect x="198" width="194" height="38" rx="7" fill="#0A162C" stroke="#1E3A5F" stroke-width="1.2" />
    <text x="210" y="15" class="mono" font-size="8.5" fill="#94A3B8" font-weight="700">EVALUATION SPEED</text>
    <text x="210" y="30" class="sans" font-size="11.5" fill="#34D399" font-weight="700">&lt; 15ms Sub-Heuristic</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 170)">
    <!-- Pill 1: Python -->
    <rect width="70" height="22" rx="5" fill="#0C213D" stroke="#38BDF8" stroke-width="1" />
    <text x="35" y="15" class="mono" font-size="10" fill="#38BDF8" font-weight="700" text-anchor="middle">Python</text>

    <!-- Pill 2: AI Safety -->
    <rect x="78" width="82" height="22" rx="5" fill="#082F2C" stroke="#14B8A6" stroke-width="1" />
    <text x="119" y="15" class="mono" font-size="10" fill="#2DD4BF" font-weight="700" text-anchor="middle">AI Safety</text>

    <!-- Pill 3: Heuristics -->
    <rect x="168" width="86" height="22" rx="5" fill="#20153D" stroke="#A78BFA" stroke-width="1" />
    <text x="211" y="15" class="mono" font-size="10" fill="#C4B5FD" font-weight="700" text-anchor="middle">Heuristics</text>

    <!-- Pill 4: LLM Gateway -->
    <rect x="262" width="94" height="22" rx="5" fill="#2E1020" stroke="#F43F5E" stroke-width="1" />
    <text x="309" y="15" class="mono" font-size="10" fill="#FDA4AF" font-weight="700" text-anchor="middle">LLM Gateway</text>
  </g>

  <!-- Footer Link Strip -->
  <line x1="20" y1="204" x2="420" y2="204" stroke="#1E2E4A" stroke-width="1.2" />
  <g transform="translate(24, 222)">
    <!-- GitHub Repo Text -->
    <text x="0" y="2" class="mono" font-size="10.5" fill="#94A3B8" font-weight="600">thenudasahas2008 / PromptSentry</text>

    <!-- Action Button -->
    <rect x="272" y="-12" width="120" height="22" rx="6" fill="#082A3A" stroke="#22D3EE" stroke-width="1.2" />
    <text x="332" y="3" class="mono" font-size="9.5" font-weight="800" fill="#22D3EE" text-anchor="middle">EXPLORE REPO ↗</text>
  </g>
</svg>
