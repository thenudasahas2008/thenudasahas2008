<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Fira Code", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Card Frame (Monochrome Dark) -->
  <rect x="1.5" y="1.5" width="437" height="237" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 22)">
    <!-- Minimalist Shield Icon -->
    <g transform="translate(0, 2)">
      <path d="M 0 5 L 11 0 L 22 5 L 22 14 C 22 20 11 25 11 25 C 11 25 0 20 0 14 Z" fill="#161B22" stroke="#8B949E" stroke-width="1.4" />
      <path d="M 11 6 L 11 18 M 6 11 L 16 11" stroke="#C9D1D9" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Project Title & Subtitle -->
    <text x="32" y="14" class="sans" font-size="17" font-weight="700" fill="#F0F6FC" letter-spacing="0.3">PromptSentry</text>
    <text x="32" y="27" class="mono" font-size="9" font-weight="600" fill="#8B949E" letter-spacing="0.6">AI SECURITY GATEWAY &amp; HEURISTIC LLM FIREWALL</text>

    <!-- Status Pill (Monochrome) -->
    <rect x="286" y="0" width="106" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="297" cy="11" r="3" fill="#E6EDF3" />
    <text x="306" y="14.5" class="mono" font-size="8.5" font-weight="700" fill="#C9D1D9" letter-spacing="0.5">ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="20" y1="60" x2="420" y2="60" stroke="#21262D" stroke-width="1" />

  <!-- Core Description -->
  <g transform="translate(24, 80)">
    <text class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      Production-grade AI firewall intercepting heuristic prompt
    </text>
    <text y="18" class="sans" font-size="12" fill="#C9D1D9" font-weight="400">
      injections, adversarial jailbreaks, and zero-day LLM exploits.
    </text>
  </g>

  <!-- Technical Metric Cards (Monochrome) -->
  <g transform="translate(24, 118)">
    <!-- Box 1 -->
    <rect width="186" height="38" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="12" y="15" class="mono" font-size="8.5" fill="#8B949E" font-weight="600">MITIGATION SCOPE</text>
    <text x="12" y="30" class="sans" font-size="11.5" fill="#F0F6FC" font-weight="600">OWASP LLM01 Defense</text>

    <!-- Box 2 -->
    <rect x="198" width="194" height="38" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1" />
    <text x="210" y="15" class="mono" font-size="8.5" fill="#8B949E" font-weight="600">EVALUATION SPEED</text>
    <text x="210" y="30" class="sans" font-size="11.5" fill="#F0F6FC" font-weight="600">&lt; 15ms Sub-Heuristic</text>
  </g>

  <!-- Tech Stack Pills (Monochrome) -->
  <g transform="translate(24, 170)">
    <!-- Pill 1: Python -->
    <rect width="70" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="35" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">Python</text>

    <!-- Pill 2: AI Safety -->
    <rect x="78" width="82" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="119" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">AI Safety</text>

    <!-- Pill 3: Heuristics -->
    <rect x="168" width="86" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="211" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">Heuristics</text>

    <!-- Pill 4: LLM Gateway -->
    <rect x="262" width="94" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="309" y="15" class="mono" font-size="10" fill="#C9D1D9" font-weight="600" text-anchor="middle">LLM Gateway</text>
  </g>

  <!-- Footer Link Strip -->
  <line x1="20" y1="204" x2="420" y2="204" stroke="#21262D" stroke-width="1" />
  <g transform="translate(24, 222)">
    <!-- GitHub Repo Text -->
    <text x="0" y="2" class="mono" font-size="10" fill="#8B949E" font-weight="500">thenudasahas2008 / PromptSentry</text>

    <!-- Action Button (Monochrome) -->
    <rect x="278" y="-12" width="114" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="335" y="3" class="mono" font-size="9" font-weight="700" fill="#F0F6FC" text-anchor="middle">EXPLORE REPO ↗</text>
  </g>
</svg>
