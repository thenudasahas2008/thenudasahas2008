name: Auto-Update GitHub Stats Telemetry

on:
  schedule:
    # Run automatically every 4 hours
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/*.svg'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-streak.svg assets/github-langs.svg
          git diff --staged --quiet || (git commit -m "chore(stats): auto-update live GitHub telemetry metrics [skip ci]" && git push)
